<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>英文學習系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .tag-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .tag-filter label {
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            white-space: nowrap;
        }

        .tag-filter-dropdown {
            position: relative;
        }

        .tag-dropdown-btn {
            background: white;
            color: #333;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.9em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 150px;
        }

        .tag-dropdown-btn:hover {
            background: #f5f5f5;
        }

        .tag-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 100;
            min-width: 300px;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            display: none;
            margin-top: 4px;
        }

        .tag-dropdown-menu.active {
            display: block;
        }

        .sheet-item {
            border-bottom: 1px solid #eee;
            position: relative;
        }

        .sheet-item-header {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 8px;
            background: #f9f9f9;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            position: relative;
        }

        .sheet-item-header:hover {
            background: #f0f0f0;
        }

        .sheet-item-header::after {
            content: '▶';
            position: absolute;
            right: 8px;
            font-size: 0.7em;
            color: #999;
            transition: transform 0.2s;
        }

        .sheet-item-header.expanded::after {
            transform: rotate(90deg);
        }

        .sheet-toggle {
            width: 20px;
            text-align: center;
            font-size: 0.8em;
            color: #666;
        }

        .sheet-name {
            flex: 1;
        }

        .sheet-group-header {
            position: sticky;
            top: 0;
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 6px 12px 6px 20px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }

        .sheet-group-header button {
            padding: 4px 12px;
            font-size: 0.85em;
            border: 1px solid #ddd;
            background: white;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 15px;
        }

        .sheet-group-header button:hover {
            background: #f5f5f5;
        }

        .sheet-submenu {
            position: fixed;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 9999;
            min-width: 150px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            display: none;
        }

        .sheet-submenu.expanded {
            display: block;
        }

        .tag-checkbox-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            padding-left: 30px;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .tag-checkbox-item:hover {
            background: #f9f9f9;
        }

        .tag-checkbox-item input[type="checkbox"] {
            cursor: pointer;
            accent-color: #667eea;
            width: 16px;
            height: 16px;
        }

        .stats {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
        }

        .words-container {
            flex: 1;
            overflow-y: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .word-row {
            display: flex;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
            height: auto;
            align-items: center;
        }

        .word-row:nth-child(odd) {
            background: #e3f2fd;
        }

        .word-row:nth-child(even) {
            background: #f5f9ff;
        }

        .word-row:hover {
            background: #bbdefb;
        }

        .word-star {
            flex: 0 0 40px;
            text-align: center;
            font-size: 1.2em;
            cursor: pointer;
            padding: 12px 8px;
            user-select: none;
            color: #ffa500;
        }

        .word-star:hover {
            transform: scale(1.2);
        }

        .word-left {
            flex: 1;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            cursor: pointer;
            overflow: hidden;
        }

        .word-tag {
            background: #667eea;
            color: white;
            padding: 4px 6px;
            border-radius: 3px;
            font-size: 0.7em;
            font-weight: bold;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            line-height: 1.2;
            width: 50px;
            text-align: center;
        }

        .word-tag-sheet {
            font-size: 0.9em;
            min-height: 12px;
        }

        .word-tag-tag {
            font-size: 0.8em;
            min-height: 12px;
        }

        .word-word {
            font-weight: bold;
            color: #333;
            min-width: 100px;
            flex-shrink: 0;
        }

        .word-phonetic {
            color: #667eea;
            font-size: 0.9em;
            min-width: 120px;
            flex-shrink: 0;
        }

        .word-pos {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            color: #666;
            min-width: 50px;
            text-align: center;
            flex-shrink: 0;
        }

        .word-chinese {
            color: #555;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .word-right {
            flex: 1;
            border-left: 1px solid #ddd;
            padding: 12px 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            min-width: 0;
        }

        .content-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            min-width: 0;
            overflow-y: auto;
        }

        .content-text {
            color: #333;
            font-size: 0.9em;
            line-height: 1.4;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #667eea #f5f5f5;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        @media (max-width: 1024px) {
            .word-phonetic {
                display: none;
            }

            .word-right {
                width: 100%;
                border-left: none;
                border-top: 1px solid #ddd;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="tag-filter">
                <label>選擇單元：</label>
                <div class="tag-filter-dropdown">
                    <button class="tag-dropdown-btn" onclick="toggleDropdown()">全部 <span>▼</span></button>
                    <div class="tag-dropdown-menu" id="tagDropdownMenu">
                        <div id="sheetGroupsContainer"></div>
                    </div>
                </div>
            </div>
            <div class="stats" id="stats"></div>
        </div>

        <div class="words-container" id="wordsContainer"></div>
    </div>

    <script>
        let allWords = [];
        let sheetData = {};
        let selectedTags = new Map(); // {sheetName: Set<tag>}

        fetch('output.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                sheetData = data;
                allWords = [];

                // 建立分組下拉選單
                const container = document.getElementById('sheetGroupsContainer');

                Object.entries(sheetData).forEach(([sheetName, words]) => {
                    if (Array.isArray(words)) {
                        // 建立該sheet的所有tag
                        const sheetTags = [...new Set(words.map(w => w.tag))];

                        // 添加到allWords
                        allWords = allWords.concat(words);

                        // 初始化selectedTags中該sheet的所有tag
                        selectedTags.set(sheetName, new Set(sheetTags));

                        // 建立sheet項目
                        const sheetItem = document.createElement('div');
                        sheetItem.className = 'sheet-item';

                        // Sheet標題（可展開）
                        const sheetHeader = document.createElement('div');
                        sheetHeader.className = 'sheet-item-header';
                        sheetHeader.dataset.sheetName = sheetName;

                        const toggleSpan = document.createElement('span');
                        toggleSpan.className = 'sheet-toggle';
                        toggleSpan.textContent = '▶';

                        const sheetCheckbox = document.createElement('input');
                        sheetCheckbox.type = 'checkbox';
                        sheetCheckbox.checked = true;
                        sheetCheckbox.dataset.sheetName = sheetName;
                        sheetCheckbox.onchange = updateFilter;
                        sheetCheckbox.onclick = (e) => {
                            e.stopPropagation();
                        };

                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'sheet-name';
                        nameSpan.textContent = sheetName;

                        sheetHeader.appendChild(sheetCheckbox);
                        sheetHeader.appendChild(nameSpan);

                        // 創建獨立的第二選單
                        const sheetSubmenu = document.createElement('div');
                        sheetSubmenu.className = 'sheet-submenu';
                        sheetSubmenu.dataset.sheetName = sheetName;
                        document.body.appendChild(sheetSubmenu);

                        // 按鈕行
                        const buttonsRow = document.createElement('div');
                        buttonsRow.className = 'sheet-group-header';

                        const selectBtn = document.createElement('button');
                        selectBtn.textContent = '全選';
                        selectBtn.onclick = function(e) {
                            e.stopPropagation();
                            selectAllInSheet(e, sheetName);
                        };

                        const clearBtn = document.createElement('button');
                        clearBtn.textContent = '清除';
                        clearBtn.onclick = function(e) {
                            e.stopPropagation();
                            clearAllInSheet(e, sheetName);
                        };

                        buttonsRow.appendChild(selectBtn);
                        buttonsRow.appendChild(clearBtn);
                        sheetSubmenu.appendChild(buttonsRow);

                        // 該sheet的所有tag
                        sheetTags.forEach(tag => {
                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.value = tag;
                            checkbox.checked = true;
                            checkbox.dataset.sheet = sheetName;
                            checkbox.onchange = updateFilter;
                            checkbox.onclick = (e) => {
                                e.stopPropagation();
                            };

                            const label = document.createElement('div');
                            label.className = 'tag-checkbox-item';
                            label.appendChild(checkbox);
                            const span = document.createElement('span');
                            span.textContent = tag;
                            label.appendChild(span);

                            label.onclick = (e) => {
                                e.stopPropagation();
                                checkbox.checked = !checkbox.checked;
                                updateFilter();
                            };

                            sheetSubmenu.appendChild(label);
                        });

                        // Sheet展開/收起邏輯 - 顯示/隱藏獨立的submenu
                        sheetHeader.onclick = (e) => {
                            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                                e.stopPropagation();

                                // 關閉其他所有的submenu
                                document.querySelectorAll('.sheet-submenu.expanded').forEach(submenu => {
                                    if (submenu !== sheetSubmenu) {
                                        submenu.classList.remove('expanded');
                                    }
                                });

                                // Toggle當前的submenu
                                sheetSubmenu.classList.toggle('expanded');

                                // 如果打開，計算位置並顯示在sheetHeader的右邊
                                if (sheetSubmenu.classList.contains('expanded')) {
                                    const rect = sheetHeader.getBoundingClientRect();
                                    sheetSubmenu.style.top = rect.top + 'px';
                                    sheetSubmenu.style.left = (rect.right + 5) + 'px';
                                }
                            }
                        };

                        sheetItem.appendChild(sheetHeader);
                        container.appendChild(sheetItem);
                    }
                });

                renderWords();

                // 點擊頁面其他地方時關閉所有的submenu
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.sheet-item-header') && !e.target.closest('.sheet-submenu')) {
                        document.querySelectorAll('.sheet-submenu.expanded').forEach(submenu => {
                            submenu.classList.remove('expanded');
                        });
                    }
                });
            })
            .catch(e => {
                document.getElementById('wordsContainer').innerHTML = '❌ 無法讀取 output.json';
            });

        function toggleDropdown() {
            const menu = document.getElementById('tagDropdownMenu');
            menu.classList.toggle('active');
        }

        function selectAllInSheet(event, sheetName) {
            event.stopPropagation();
            const checkboxes = document.querySelectorAll(`input[data-sheet="${sheetName}"]`);
            checkboxes.forEach(checkbox => {
                checkbox.checked = true;
            });
            updateFilter();
        }

        function clearAllInSheet(event, sheetName) {
            event.stopPropagation();
            // 只清除該 sheet 的 checkbox
            const checkboxes = document.querySelectorAll(`input[data-sheet="${sheetName}"]`);
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            updateFilter();
        }

        function updateFilter() {
            // 為每個sheet更新selected tags
            selectedTags.forEach((tags, sheetName) => {
                tags.clear();
            });

            // 先檢查sheet checkbox，如果unchecked則skip該sheet
            const enabledSheets = new Set();
            document.querySelectorAll('input[data-sheet-name]').forEach(sheetCheckbox => {
                if (sheetCheckbox.checked) {
                    enabledSheets.add(sheetCheckbox.dataset.sheetName);
                }
            });

            // 只處理enabled sheets的tag checkbox
            document.querySelectorAll('.tag-checkbox-item input').forEach(checkbox => {
                if (checkbox.checked) {
                    const sheetName = checkbox.dataset.sheet;
                    if (enabledSheets.has(sheetName) && selectedTags.has(sheetName)) {
                        selectedTags.get(sheetName).add(checkbox.value);
                    }
                }
            });
            updateDropdownButton();
            renderWords();
        }

        function updateDropdownButton() {
            const btn = document.querySelector('.tag-dropdown-btn');
            let totalSelected = 0;
            selectedTags.forEach(tags => {
                totalSelected += tags.size;
            });
            if (totalSelected === 0) {
                btn.innerHTML = '清除 <span>▼</span>';
            } else {
                btn.innerHTML = `已選擇 ${totalSelected} 個 <span>▼</span>`;
            }
        }

        document.addEventListener('click', (e) => {
            const filter = document.querySelector('.tag-filter');
            if (!filter.contains(e.target)) {
                document.getElementById('tagDropdownMenu').classList.remove('active');
            }
        });

        function playPronunciation(word) {
            const SpeechSynthesisUtterance = window.SpeechSynthesisUtterance || window.webkitSpeechSynthesisUtterance;
            const speechSynthesis = window.speechSynthesis || window.webkitSpeechSynthesis;

            if (!SpeechSynthesisUtterance || !speechSynthesis) {
                console.log('Web Speech API not supported');
                return;
            }

            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        function renderWords() {
            const container = document.getElementById('wordsContainer');
            container.innerHTML = '';

            // 檢查enabled sheets
            const enabledSheets = new Set();
            document.querySelectorAll('input[data-sheet-name]').forEach(sheetCheckbox => {
                if (sheetCheckbox.checked) {
                    enabledSheets.add(sheetCheckbox.dataset.sheetName);
                }
            });

            // 根據選中的sheet+tag過濾單字
            const filteredWords = allWords.filter(word => {
                // 如果sheet checkbox unchecked，忽略該sheet
                if (!enabledSheets.has(word.sheet)) {
                    return false;
                }
                const sheetTags = selectedTags.get(word.sheet);
                return sheetTags && sheetTags.has(word.tag);
            });

            document.getElementById('stats').textContent = `共 ${filteredWords.length} 項`;

            filteredWords.forEach((word, index) => {
                const row = document.createElement('div');
                row.className = 'word-row';

                // 創建星號按鈕
                const starBtn = document.createElement('div');
                starBtn.className = 'word-star';
                const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                const isFavorited = localStorage.getItem(`favorite_${wordKey}`) === 'true';
                starBtn.textContent = isFavorited ? '★' : '☆';
                starBtn.dataset.wordKey = wordKey;
                starBtn.onclick = (e) => {
                    e.stopPropagation();
                    const isFav = localStorage.getItem(`favorite_${wordKey}`) === 'true';
                    if (isFav) {
                        localStorage.removeItem(`favorite_${wordKey}`);
                        starBtn.textContent = '☆';
                    } else {
                        localStorage.setItem(`favorite_${wordKey}`, 'true');
                        starBtn.textContent = '★';
                    }
                };

                // 創建左側內容
                const wordLeft = document.createElement('div');
                wordLeft.className = 'word-left';
                wordLeft.onclick = () => playPronunciation(word.單字);
                wordLeft.innerHTML = `
                    ${word.sheet || word.tag ? `<span class="word-tag"><div class="word-tag-sheet">${word.sheet || ''}</div><div class="word-tag-tag">${word.tag || ''}</div></span>` : ''}
                    <span class="word-word">${word.單字}</span>
                    <span class="word-phonetic">${word.音標}</span>
                    <span class="word-pos">${word.詞性}</span>
                    <span class="word-chinese">${word.中文}</span>
                `;

                // 創建右側內容
                const wordRight = document.createElement('div');
                wordRight.className = 'word-right';
                wordRight.innerHTML = `
                    <div class="content-half">
                        <div class="content-text">${word.例句}</div>
                    </div>
                    <div class="content-half">
                        <div class="content-text">${word.翻譯}</div>
                    </div>
                `;

                row.appendChild(starBtn);
                row.appendChild(wordLeft);
                row.appendChild(wordRight);
                container.appendChild(row);
            });
        }
    </script>
</body>
</html>
