<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>英文學習系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d2d45 0%, #25254f 100%);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            text-align: center;
            flex: 1;
        }

        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 20px 0;
            margin: 0;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
            position: relative;
        }

        .title {
            font-size: 2.5em;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin: 0;
        }

        .settings-btn {
            background: gray;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 1.4em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .settings-btn:hover {
            background: lightgray;
        }

        .settings-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #4a4a62;
            border: 1px solid #5a5a72;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 100;
            min-width: 150px;
            margin-top: 4px;
            display: none;
        }

        .settings-dropdown.active {
            display: block;
        }

        .settings-option {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: none;
            border: none;
            color: #b8b8b8;
            text-align: left;
            cursor: pointer;
            font-size: 1em;
        }

        .settings-option:hover {
            background: #5a5a72;
        }

        .buttons-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 40px 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.5em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            min-width: 200px;
            min-height: 200px;
        }

        .mode-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .mode-btn:active {
            transform: translateY(-2px);
        }

        .mode-btn-icon {
            font-size: 3em;
        }

        .mode-btn-text {
            font-size: 1.8em;
        }

        .english-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .chinese-btn {
            background: linear-gradient(135deg, #2196F3 0%, #21CBF3 100%);
        }

        .chinese-btn:hover {
            background: linear-gradient(135deg, #21CBF3 0%, #2196F3 100%);
            box-shadow: 0 12px 30px rgba(33, 150, 243, 0.6);
        }

    </style>
</head>
<body>
    <div class="title-bar">
        <div class="title">學習網</div>
        <button class="settings-btn" onclick="toggleSettingsMenu()">⚙️</button>
        <div class="settings-dropdown" id="settingsDropdown">
            <button class="settings-option" onclick="showAbout()">ℹ️ 資訊</button>
            <button class="settings-option" onclick="showPronunciationSettings()">🔊 發音</button>
            <div class="settings-option" style="display: flex; align-items: center; justify-content: flex-start; padding: 12px 16px; background: none; border: none; cursor: pointer; gap: 10px;" onclick="document.getElementById('allowRetestCheckbox').click()">
                <input type="checkbox" id="allowRetestCheckbox" style="width: 16px; height: 16px; cursor: pointer;" onclick="event.stopPropagation();">
                <span style="color: #b8b8b8; text-align: left; flex: 1;">允許重測</span>
            </div>
            <div class="settings-option" style="display: flex; align-items: center; justify-content: flex-start; padding: 12px 16px; background: none; border: none; cursor: pointer; gap: 10px;" onclick="document.getElementById('randomQuizCheckbox').click()">
                <input type="checkbox" id="randomQuizCheckbox" style="width: 16px; height: 16px; cursor: pointer;" onclick="event.stopPropagation();">
                <span style="color: #b8b8b8; text-align: left; flex: 1;">隨機測驗</span>
            </div>
            <button class="settings-option" onclick="updateApp()">🔄 更新</button>
            <button class="settings-option" onclick="clearHistory()">清除紀錄</button>
        </div>
    </div>
    <div class="container">
        <div class="buttons-wrapper">
            <button class="mode-btn english-btn" onclick="goToEnglish()">
                <div class="mode-btn-text">英文</div>
            </button>

            <button class="mode-btn chinese-btn" onclick="goChinese()">
                <div class="mode-btn-text">中文</div>
            </button>
        </div>
    </div>

    <!-- 發音設定視窗 -->
    <div id="pronunciationModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #333; border-radius: 8px; padding: 20px; max-width: 500px; width: 90%; color: white;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span style="font-weight: bold; font-size: 1.2em;">🔊 發音設定</span>
                <button onclick="closePronunciationModal()" style="background: none; border: none; color: white; font-size: 1.5em; cursor: pointer;">×</button>
            </div>
            <div style="gap: 20px; display: flex; flex-direction: column;">
                <div style="text-align: left;">
                    <label style="color: white; font-weight: bold; display: block; margin-bottom: 8px;">語言</label>
                    <select id="pronunciationLangSelect" style="width: 100%; padding: 8px; font-size: 1em; border-radius: 4px; border: none;">
                        <!-- 英語 -->
                        <optgroup label="━━━ 英語 ━━━">
                            <option value="en-US">🇺🇸 美國英語 (en-US)</option>
                            <option value="en-GB">🇬🇧 英國英語 (en-GB)</option>
                            <option value="en-AU">🇦🇺 澳洲英語 (en-AU)</option>
                            <option value="en-CA">🇨🇦 加拿大英語 (en-CA)</option>
                            <option value="en-IN">🇮🇳 印度英語 (en-IN)</option>
                            <option value="en-IE">🇮🇪 愛爾蘭英語 (en-IE)</option>
                            <option value="en-NZ">🇳🇿 紐西蘭英語 (en-NZ)</option>
                        </optgroup>
                        <!-- 中文 -->
                        <optgroup label="━━━ 中文 ━━━">
                            <option value="zh-CN">🇨🇳 簡體中文 (zh-CN)</option>
                            <option value="zh-HK">🇭🇰 香港繁體 (zh-HK)</option>
                            <option value="zh-TW">🇹🇼 台灣繁體 (zh-TW)</option>
                        </optgroup>
                        <!-- 亞洲語言 -->
                        <optgroup label="━━━ 亞洲語言 ━━━">
                            <option value="ja-JP">🇯🇵 日語 (ja-JP)</option>
                            <option value="ko-KR">🇰🇷 韓語 (ko-KR)</option>
                            <option value="th-TH">🇹🇭 泰語 (th-TH)</option>
                            <option value="vi-VN">🇻🇳 越南語 (vi-VN)</option>
                            <option value="id-ID">🇮🇩 印尼語 (id-ID)</option>
                            <option value="ta-IN">🇮🇳 泰米爾語 (ta-IN)</option>
                            <option value="hi-IN">🇮🇳 印地語 (hi-IN)</option>
                        </optgroup>
                        <!-- 歐洲語言 -->
                        <optgroup label="━━━ 歐洲語言 ━━━">
                            <option value="fr-FR">🇫🇷 法語 (fr-FR)</option>
                            <option value="fr-CA">🇨🇦 加拿大法語 (fr-CA)</option>
                            <option value="de-DE">🇩🇪 德語 (de-DE)</option>
                            <option value="es-ES">🇪🇸 西班牙語 (es-ES)</option>
                            <option value="es-MX">🇲🇽 墨西哥西班牙語 (es-MX)</option>
                            <option value="it-IT">🇮🇹 義大利語 (it-IT)</option>
                            <option value="pt-PT">🇵🇹 葡萄牙語 (pt-PT)</option>
                            <option value="pt-BR">🇧🇷 巴西葡萄牙語 (pt-BR)</option>
                            <option value="nl-NL">🇳🇱 荷蘭語 (nl-NL)</option>
                            <option value="pl-PL">🇵🇱 波蘭語 (pl-PL)</option>
                            <option value="ru-RU">🇷🇺 俄語 (ru-RU)</option>
                            <option value="sv-SE">🇸🇪 瑞典語 (sv-SE)</option>
                            <option value="da-DK">🇩🇰 丹麥語 (da-DK)</option>
                            <option value="tr-TR">🇹🇷 土耳其語 (tr-TR)</option>
                            <option value="el-GR">🇬🇷 希臘語 (el-GR)</option>
                        </optgroup>
                        <!-- 中東與其他 -->
                        <optgroup label="━━━ 中東與其他 ━━━">
                            <option value="ar-SA">🇸🇦 阿拉伯語 (ar-SA)</option>
                            <option value="he-IL">🇮🇱 希伯來語 (he-IL)</option>
                        </optgroup>
                    </select>
                </div>
                <div style="text-align: left;">
                    <label style="color: white; font-weight: bold; display: block; margin-bottom: 8px;">速度</label>
                    <select id="pronunciationRateSelect" style="width: 100%; padding: 8px; font-size: 1em; border-radius: 4px; border: none;">
                        <option value="0.5">🐢 極慢 (0.5x)</option>
                        <option value="0.8">🐌 慢 (0.8x)</option>
                        <option value="1.0" selected>📢 正常 (1.0x)</option>
                        <option value="1.2">⚡ 快 (1.2x)</option>
                        <option value="1.5">🚀 很快 (1.5x)</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="savePronunciationSettings()" style="flex: 1; padding: 10px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">保存設定</button>
            </div>
        </div>
    </div>

    <script>
        function goToEnglish() {
            window.location.href = 'english.html';
        }

        function goChinese() {
            window.location.href = 'chinese.html';
        }

        function toggleSettingsMenu() {
            const dropdown = document.getElementById('settingsDropdown');
            dropdown.classList.toggle('active');
        }

        function showAbout() {
            alert('學習網\n版本：2026.07.24\n\n功能：\n• 英文學習\n• 中文成語與改錯');
        }

        function showPronunciationSettings() {
            const modal = document.getElementById('pronunciationModal');
            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            const pronunciationLang = settings.pronunciationLang || 'en-US';
            const pronunciationRate = (settings.pronunciationRate || 1.0);

            document.getElementById('pronunciationLangSelect').value = pronunciationLang;
            document.getElementById('pronunciationRateSelect').value = pronunciationRate.toFixed(1);

            modal.style.display = 'flex';
        }

        function closePronunciationModal() {
            document.getElementById('pronunciationModal').style.display = 'none';
        }

        function savePronunciationSettings() {
            const langSelect = document.getElementById('pronunciationLangSelect');
            const rateSelect = document.getElementById('pronunciationRateSelect');

            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            settings.pronunciationLang = langSelect.value;
            settings.pronunciationRate = parseFloat(rateSelect.value);

            localStorage.setItem('setting', JSON.stringify(settings));

            alert('發音設定已保存');
            closePronunciationModal();
        }

        function updateApp() {
            if (confirm('即將清除快取並更新應用。確認更新嗎？')) {
                if ('caches' in window) {
                    caches.keys().then(names => {
                        names.forEach(name => caches.delete(name));
                    });
                }
                location.reload(true);
            }
        }

        function clearHistory() {
            if (confirm('確定要清除所有學習紀錄嗎？此操作無法撤銷。')) {
                localStorage.clear();
                initializeLocalStorage();
                alert('紀錄已清除');
            }
        }

        // localStorage 版本控制
        const STORAGE_VERSION = '1.0';

        function initializeLocalStorage() {
            const version = localStorage.getItem('_storageVersion');
            if (!version || version !== STORAGE_VERSION) {
                migrateLocalStorage(version);
                localStorage.setItem('_storageVersion', STORAGE_VERSION);
            }
        }

        function migrateLocalStorage(oldVersion) {
            if (!oldVersion) {
                // 舊版本遷移邏輯
                const oldData = {};

                // 收集舊的localStorage數據
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && !key.startsWith('_')) {
                        oldData[key] = localStorage.getItem(key);
                    }
                }

                // 清除舊數據
                const keysToDelete = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && !key.startsWith('_') && key !== '_storageVersion') {
                        keysToDelete.push(key);
                    }
                }
                keysToDelete.forEach(key => localStorage.removeItem(key));

                // 初始化新結構
                localStorage.setItem('setting', JSON.stringify({}));
                localStorage.setItem('english', JSON.stringify({
                    favorite: {},
                    quiz: {},
                    customWords: []
                }));
                localStorage.setItem('chinese', JSON.stringify({}));

                console.log('已將localStorage升級至版本 ' + STORAGE_VERSION);
            }
        }

        // 頁面加載時初始化localStorage
        initializeLocalStorage();

        // 初始化重測設定
        const allowRetestCheckbox = document.getElementById('allowRetestCheckbox');
        if (allowRetestCheckbox) {
            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            allowRetestCheckbox.checked = settings.allowRetest || false;
            allowRetestCheckbox.addEventListener('change', (e) => {
                const settings = JSON.parse(localStorage.getItem('setting') || '{}');
                settings.allowRetest = e.target.checked;
                localStorage.setItem('setting', JSON.stringify(settings));
            });
        }

        // 初始化隨機測驗設定
        const randomQuizCheckbox = document.getElementById('randomQuizCheckbox');
        if (randomQuizCheckbox) {
            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            randomQuizCheckbox.checked = settings.randomQuiz !== false; // 預設為 true
            randomQuizCheckbox.addEventListener('change', (e) => {
                const settings = JSON.parse(localStorage.getItem('setting') || '{}');
                settings.randomQuiz = e.target.checked;
                localStorage.setItem('setting', JSON.stringify(settings));
            });
        }

        // 點擊外部時關閉菜單
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('settingsDropdown');
            const btn = event.target.closest('.settings-btn');
            if (!btn && dropdown.classList.contains('active')) {
                dropdown.classList.remove('active');
            }
        });
    </script>
</body>
</html>
