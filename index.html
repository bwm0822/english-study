        function updateQuizDropdownButton() {
            const btn = document.querySelector('#quizTagFilterContainer .tag-dropdown-btn');
            const stats = document.getElementById('stats');
            if (!btn) return;

            // 檢查星號篩選
            const starCheckbox = document.getElementById('quiz-star-filter');
            const filterByStar = starCheckbox ? starCheckbox.checked : false;

            // 只在 quiz mode 容器中查詢 sheet checkbox
            const quizContainer = document.getElementById('quizSheetGroupsContainer');
            const enabledSheets = new Set();
            document.querySelectorAll('input.quiz-sheet-checkbox').forEach(sheetCheckbox => {
                if (sheetCheckbox.checked) {
                    enabledSheets.add(sheetCheckbox.dataset.sheetName);
                }
            });

            // 獲取選中的 tags（只考慮 quiz mode 的 enabled sheets）
            const selectedSheetTags = new Map();
            document.querySelectorAll('input.quiz-tag-checkbox').forEach(checkbox => {
                if (checkbox.checked && enabledSheets.has(checkbox.dataset.sheet)) {
                    const sheetName = checkbox.dataset.sheet;
                    if (!selectedSheetTags.has(sheetName)) {
                        selectedSheetTags.set(sheetName, new Set());
                    }
                    selectedSheetTags.get(sheetName).add(checkbox.value);
                }
            });

            // 檢查正確率篩選
            const accuracyCheckbox = document.getElementById('quiz-accuracy-filter-checkbox');
            const accuracySelect = document.getElementById('quiz-accuracy-filter-select');
            let filterByAccuracy = null;
            if (accuracyCheckbox && accuracyCheckbox.checked && accuracySelect) {
                const threshold = accuracySelect.value.replace(/[<=%]/g, '');
                filterByAccuracy = parseInt(threshold);
            }

            // 計算選中的單詞數量
            let selectedWords = 0;
            if (selectedSheetTags.size > 0) {
                selectedWords = allWords.filter(word => {
                    if (!selectedSheetTags.has(word.sheet)) {
                        return false;
                    }
                    if (!selectedSheetTags.get(word.sheet).has(word.tag)) {
                        return false;
                    }
                    // 如果勾選星號篩選，只包含有星號的單字
                    if (filterByStar) {
                        const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                        if (localStorage.getItem(`favorite_${wordKey}`) !== 'true') {
                            return false;
                        }
                    }
                    // 如果勾選正確率篩選，只包含符合條件的單字
                    if (filterByAccuracy !== null) {
                        const historyKey = `quizHistory_${word.sheet}/${word.tag}/${word.單字}`;
                        const history = JSON.parse(localStorage.getItem(historyKey)) || [];
                        if (history.length === 0) {
                            return false;
                        }
                        const correct = history.filter(v => v).length;
                        const accuracy = Math.round((correct / history.length) * 100);
                        if (!(accuracy <= filterByAccuracy)) {
                            return false;
                        }
                    }
                    return true;
                }).length;
            }

            let totalSelected = 0;
            quizContainer.querySelectorAll('input[data-sheet]').forEach(checkbox => {
                if (checkbox.checked && enabledSheets.has(checkbox.dataset.sheet)) {
                    totalSelected++;
                }
            });

            if (totalSelected === 0) {
                btn.innerHTML = '清除 <span>▼</span>';
            } else {
                btn.innerHTML = `已選擇 ${totalSelected} 個 <span>▼</span>`;
            }

            // 更新統計信息 - 顯示選中的單詞數量
            if (stats) {
                stats.textContent = `共 ${selectedWords} 項`;
            }
        }

        function startQuiz() {
            // 檢查星號篩選
            const starCheckbox = document.getElementById('quiz-star-filter');
            const filterByStar = starCheckbox ? starCheckbox.checked : false;

            // 只在 quiz mode 容器中查詢 sheet checkbox
            const quizContainer = document.getElementById('quizSheetGroupsContainer');
            const enabledSheets = new Set();
            document.querySelectorAll('input.quiz-sheet-checkbox').forEach(sheetCheckbox => {
                if (sheetCheckbox.checked) {
                    enabledSheets.add(sheetCheckbox.dataset.sheetName);
                }
            });

            // 獲取勾選的tags - 加入到對應的sheet（只考慮 quiz mode 的 enabled sheets）
            const selectedSheetTags = new Map(); // {sheetName: Set<tag>}
            document.querySelectorAll('input.quiz-tag-checkbox').forEach(checkbox => {
                if (checkbox.checked && enabledSheets.has(checkbox.dataset.sheet)) {
                    const sheetName = checkbox.dataset.sheet;
                    if (!selectedSheetTags.has(sheetName)) {
                        selectedSheetTags.set(sheetName, new Set());
                    }
                    selectedSheetTags.get(sheetName).add(checkbox.value);
                }
            });

            if (selectedSheetTags.size === 0) {
                alert('請至少選擇一個單元');
                return;
            }

            // 檢查正確率篩選
            const accuracyCheckbox = document.getElementById('quiz-accuracy-filter-checkbox');
            const accuracySelect = document.getElementById('quiz-accuracy-filter-select');
            let filterByAccuracy = null;
            if (accuracyCheckbox && accuracyCheckbox.checked && accuracySelect) {
                // 移除 < 和 % 符號後解析
                const threshold = accuracySelect.value.replace(/[<=%]/g, '');
                filterByAccuracy = parseInt(threshold);
            }

            // 收集要測驗的單詞 - 根據sheet和tag過濾
            quizWords = allWords.filter(word => {
                if (!selectedSheetTags.has(word.sheet)) {
                    return false;
                }
                if (!selectedSheetTags.get(word.sheet).has(word.tag)) {
                    return false;
                }
                // 如果勾選星號篩選，只包含有星號的單字
                if (filterByStar) {
                    const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                    if (localStorage.getItem(`favorite_${wordKey}`) !== 'true') {
                        return false;
                    }
                }
                // 如果勾選正確率篩選，只包含符合條件的單字
                if (filterByAccuracy !== null) {
                    const historyKey = `quizHistory_${word.sheet}/${word.tag}/${word.單字}`;
                    const history = JSON.parse(localStorage.getItem(historyKey)) || [];
                    if (history.length === 0) {
                        return false; // 沒有歷史記錄的單字不包含
                    }
                    const correct = history.filter(v => v).length;
                    const accuracy = Math.round((correct / history.length) * 100);
                    return accuracy <= filterByAccuracy;
                }
                return true;
            });

            if (quizWords.length === 0) {
                alert('選定的單元中沒有單詞');
                return;
            }

            // 隨機排列
            quizWords.sort(() => Math.random() - 0.5);

            // 初始化結果
            quizResults = quizWords.map(word => ({
                word: word,
                isCorrect: null,
                userAnswer: ''
            }));

            quizIndex = 0;
            document.getElementById('quizTagFilterContainer').style.display = 'none';
            document.getElementById('quizStartPanel').style.display = 'none';
            document.getElementById('quizSession').style.display = 'flex';
            showQuizQuestion();
        }

        function showQuizQuestion() {
            const word = quizWords[quizIndex];
            document.getElementById('quizProgress').textContent = `${quizIndex + 1}/${quizWords.length}`;
            document.getElementById('quizChinese').textContent = word.中文;
            document.getElementById('quizPos').textContent = word.詞性;
            document.getElementById('quizInput').value = '';
            document.getElementById('quizFeedback').innerHTML = '';
            document.getElementById('quizAnswer').style.display = 'none';
            document.getElementById('quizInput').disabled = false;
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('retestBtn').style.display = 'none';
            document.getElementById('quizInput').focus();
        }

        function handleQuizInput(event) {
            if (event.key !== 'Enter') return;
            event.preventDefault();

            const userAnswer = document.getElementById('quizInput').value.trim().toLowerCase();
            const word = quizWords[quizIndex];
            const isCorrect = userAnswer === word.單字.toLowerCase();
            quizResults[quizIndex].isCorrect = isCorrect;
            quizResults[quizIndex].userAnswer = userAnswer;

            const feedbackDiv = document.getElementById('quizFeedback');
            feedbackDiv.innerHTML = '';

            if (isCorrect) {
                const correctDiv = document.createElement('div');
                correctDiv.className = 'feedback-correct';
                correctDiv.textContent = '✓ 正確';
                feedbackDiv.appendChild(correctDiv);
            } else {
                // 显示正确答案
                document.getElementById('quizAnswer').textContent = word.單字;
                document.getElementById('quizAnswer').style.display = 'block';

                // 只显示错误状态
                const errorDiv = document.createElement('div');
                errorDiv.className = 'feedback-error';
                errorDiv.textContent = '✗ 錯誤';
                feedbackDiv.appendChild(errorDiv);
            }

            // 禁用輸入框
            document.getElementById('quizInput').disabled = true;
            // 根據是否正確決定顯示哪個按鈕
            if (isCorrect) {
                document.getElementById('nextBtn').style.display = 'block';
                document.getElementById('retestBtn').style.display = 'none';
            } else {
                document.getElementById('nextBtn').style.display = 'block';
                document.getElementById('retestBtn').style.display = 'block';
            }
        }

        function nextQuestion() {
            quizIndex++;
            if (quizIndex < quizWords.length) {
                showQuizQuestion();
            } else {
                showQuizResult();
            }
        }

        function retestWord() {
            // 重置當前單字的答案
            quizResults[quizIndex].isCorrect = null;
            quizResults[quizIndex].userAnswer = '';
            // 重新顯示問題
            showQuizQuestion();
        }

        function showQuizResult() {
            document.getElementById('quizSession').style.display = 'none';
            document.getElementById('quizResult').style.display = 'block';

            // 只統計已測試的單字（isCorrect 不為 null）
            const testedResults = quizResults.filter(r => r.isCorrect !== null);

            // 保存每個單詞的測驗結果到localStorage
            testedResults.forEach(result => {
                const word = result.word;
                const wordKey = `quizHistory_${word.sheet}/${word.tag}/${word.單字}`;
                let history = JSON.parse(localStorage.getItem(wordKey)) || [];
                history.push(result.isCorrect);
                // 只保留最近5次
                if (history.length > 5) {
                    history = history.slice(-5);
                }
                localStorage.setItem(wordKey, JSON.stringify(history));
            });

            const correctCount = testedResults.filter(r => r.isCorrect).length;
            const accuracy = testedResults.length > 0 ? Math.round((correctCount / testedResults.length) * 100) : 0;

            document.getElementById('resultScore').innerHTML = `正確率: ${accuracy}% (${correctCount}/${testedResults.length})`;

            const resultWordsDiv = document.getElementById('resultWords');
            resultWordsDiv.innerHTML = '';

            testedResults.forEach((result, index) => {
                const wordDiv = document.createElement('div');
                wordDiv.className = `result-word ${result.isCorrect ? 'correct' : 'wrong'}`;

                const word = result.word;
                const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                const isFavorited = localStorage.getItem(`favorite_${wordKey}`) === 'true';

                // 星號
                const starSpan = document.createElement('div');
                starSpan.className = 'result-word-star';
                starSpan.textContent = isFavorited ? '★' : '☆';
                starSpan.onclick = (e) => {
                    e.stopPropagation();
                    // 重新檢查當前狀態
                    const currentIsFav = localStorage.getItem(`favorite_${wordKey}`) === 'true';
                    if (currentIsFav) {
                        localStorage.removeItem(`favorite_${wordKey}`);
                        starSpan.textContent = '☆';
                    } else {
                        localStorage.setItem(`favorite_${wordKey}`, 'true');
                        starSpan.textContent = '★';
                    }
                };

                // Sheet/Tag
                const tagDiv = document.createElement('div');
                tagDiv.className = 'result-word-tag';
                tagDiv.innerHTML = `<div>${word.sheet}</div><div>${word.tag}</div>`;

                // 計算正確率
                const historyKey = `quizHistory_${word.sheet}/${word.tag}/${word.單字}`;
                const history = JSON.parse(localStorage.getItem(historyKey)) || [];
                let accuracyDisplay = '--';
                if (history.length > 0) {
                    const correct = history.filter(v => v).length;
                    const accuracy = Math.round((correct / history.length) * 100);
                    accuracyDisplay = `${accuracy}%`;
                }

                // 正確率
                const accuracyDiv = document.createElement('div');
                accuracyDiv.className = 'result-word-accuracy';
                accuracyDiv.textContent = accuracyDisplay;

                // 英文單字
                const englishSpan = document.createElement('div');
                englishSpan.className = 'result-word-english';
                englishSpan.textContent = word.單字;
                englishSpan.style.cursor = 'pointer';
                englishSpan.onclick = (e) => {
                    e.stopPropagation();
                    playPronunciation(word.單字);
                };

                // 詞性
                const posSpan = document.createElement('div');
                posSpan.className = 'result-word-pos';
                posSpan.textContent = word.詞性;

                // 中文
                const chineseSpan = document.createElement('div');
                chineseSpan.className = 'result-word-chinese';
                chineseSpan.textContent = word.中文;

                wordDiv.appendChild(starSpan);
                wordDiv.appendChild(tagDiv);
                wordDiv.appendChild(accuracyDiv);
                wordDiv.appendChild(englishSpan);
                wordDiv.appendChild(posSpan);
                wordDiv.appendChild(chineseSpan);

                resultWordsDiv.appendChild(wordDiv);
            });
        }

        function backToQuizPanel() {
            document.getElementById('quizTagFilterContainer').style.display = 'flex';
            document.getElementById('quizStartPanel').style.display = 'flex';
            document.getElementById('quizSession').style.display = 'none';
            document.getElementById('quizResult').style.display = 'none';
        }

        function cancelQuiz() {
            showQuizResult();
        }

        function toggleSettingsMenu() {
            const dropdown = document.getElementById('settingsDropdown');
            dropdown.classList.toggle('active');
        }

        function clearHistory() {
            if (confirm('確定要清除所有學習紀錄嗎？此操作無法撤銷。')) {
                // 清除所有 localStorage 的數據
                const keysToDelete = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('favorite_') || key.startsWith('quizHistory_')) {
                        keysToDelete.push(key);
                    }
                }
                keysToDelete.forEach(key => {
                    localStorage.removeItem(key);
                });
                alert('紀錄已清除');
                // 刷新頁面以顯示更新
                location.reload();
            }
        }

        // 點擊頁面其他地方時關閉設置菜單
        document.addEventListener('click', (e) => {
            const settingsContainer = document.getElementById('settingsMenuContainer');
            if (settingsContainer && !settingsContainer.contains(e.target)) {
                document.getElementById('settingsDropdown').classList.remove('active');
            }
        });

        // 單字視窗函數
        function openWordModal(wordIndex, filteredWords) {
            currentFilteredWords = filteredWords;
            modalCurrentWordIndex = wordIndex;
            displayWordInModal(wordIndex, filteredWords);
            document.getElementById('wordModal').style.display = 'flex';

            // Focus 到單字列中對應的單字
            if (wordIndex >= 0 && wordIndex < filteredWords.length) {
                const word = filteredWords[wordIndex];
                const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                const wordRow = document.querySelector(`[data-word-key="${wordKey}"][data-filtered-index="${wordIndex}"]`);
                if (wordRow) {
                    wordRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    wordRow.style.backgroundColor = '#5a5a72';
                    setTimeout(() => {
                        wordRow.style.backgroundColor = '';
                    }, 1000);
                }
            }
        }

        function closeWordModal() {
            document.getElementById('wordModal').style.display = 'none';
            currentFilteredWords = [];
            modalCurrentWordIndex = -1;
        }

        function displayWordInModal(wordIndex, filteredWords) {
            if (wordIndex < 0 || wordIndex >= filteredWords.length) return;

            const word = filteredWords[wordIndex];
            const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;

            // 更新導航按鈕顯示狀態
            const prevBtn = document.querySelector('.word-modal-footer .modal-nav-btn:nth-child(1)');
            const nextBtn = document.querySelector('.word-modal-footer .modal-nav-btn:nth-child(2)');
            prevBtn.style.visibility = wordIndex > 0 ? 'visible' : 'hidden';
            nextBtn.style.visibility = wordIndex < filteredWords.length - 1 ? 'visible' : 'hidden';

            // 更新頁頭
            document.getElementById('modalWordIndex').textContent = wordIndex + 1;

            const starSpan = document.getElementById('modalWordStar');
            const isFavorited = localStorage.getItem(`favorite_${wordKey}`) === 'true';
            starSpan.textContent = isFavorited ? '★' : '☆';
            starSpan.onclick = (e) => {
                e.stopPropagation();
                const currentIsFav = localStorage.getItem(`favorite_${wordKey}`) === 'true';
                if (currentIsFav) {
                    localStorage.removeItem(`favorite_${wordKey}`);
                    starSpan.textContent = '☆';
                } else {
                    localStorage.setItem(`favorite_${wordKey}`, 'true');
                    starSpan.textContent = '★';
                }
            };

            const tagDiv = document.getElementById('modalWordTag');
            tagDiv.querySelector('.modal-tag-sheet').textContent = word.sheet;
            tagDiv.querySelector('.modal-tag-tag').textContent = word.tag;

            const historyKey = `quizHistory_${word.sheet}/${word.tag}/${word.單字}`;
            const history = JSON.parse(localStorage.getItem(historyKey)) || [];
            let accuracyDisplay = '--';
            if (history.length > 0) {
                const correct = history.filter(v => v).length;
                const accuracy = Math.round((correct / history.length) * 100);
                accuracyDisplay = `${accuracy}%`;
            }
            document.getElementById('modalWordAccuracy').textContent = accuracyDisplay;

            // 更新內容
            const modalWordEl = document.getElementById('modalWord');
            modalWordEl.textContent = word.單字;
            modalWordEl.style.cursor = 'pointer';
            modalWordEl.onclick = () => playPronunciation(word.單字);

            const modalPhoneticEl = document.getElementById('modalPhonetic');
            modalPhoneticEl.textContent = word.音標;
            modalPhoneticEl.style.cursor = 'pointer';
            modalPhoneticEl.onclick = () => playPronunciation(word.單字);

            document.getElementById('modalPos').textContent = word.詞性;
            document.getElementById('modalChinese').textContent = word.中文;
            document.getElementById('modalExample').textContent = word.例句;
            document.getElementById('modalTranslation').textContent = word.翻譯;
        }

        function previousWord() {
            if (modalCurrentWordIndex > 0) {
                modalCurrentWordIndex--;
                displayWordInModal(modalCurrentWordIndex, currentFilteredWords);
                focusWordInList(modalCurrentWordIndex, currentFilteredWords);
            }
        }

        function nextWord() {
            if (modalCurrentWordIndex < currentFilteredWords.length - 1) {
                modalCurrentWordIndex++;
                displayWordInModal(modalCurrentWordIndex, currentFilteredWords);
                focusWordInList(modalCurrentWordIndex, currentFilteredWords);
            }
        }

        function focusWordInList(wordIndex, filteredWords) {
            if (wordIndex >= 0 && wordIndex < filteredWords.length) {
                const word = filteredWords[wordIndex];
                const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                const wordRow = document.querySelector(`[data-word-key="${wordKey}"][data-filtered-index="${wordIndex}"]`);
                if (wordRow) {
                    wordRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    wordRow.style.backgroundColor = '#5a5a72';
                    setTimeout(() => {
                        wordRow.style.backgroundColor = '';
                    }, 1000);
                }
            }
        }

        // 點擊視窗外部時關閉
        document.getElementById('wordModal').addEventListener('click', (e) => {
            if (e.target.id === 'wordModal') {
                closeWordModal();
            }
        });
    </script>
</body>
</html>
