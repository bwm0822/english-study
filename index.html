<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>英文學習系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d2d45 0%, #25254f 100%);
            padding: 10px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            background: linear-gradient(135deg, #2d2d45 0%, #25254f 100%);
            border-radius: 8px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .mode-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-selector label {
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            white-space: nowrap;
        }

        .mode-selector select {
            background: gray;
            color: #333;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 1.1em;
            cursor: pointer;
        }

        .mode-selector select:hover {
            background: lightgray; 
        }

        .refresh-btn {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: 600;
        }

        .refresh-btn:hover {
            background: #45a049;
        }

        .quiz-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #3a3a52;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            min-height: 0;
            color: #b8b8b8;
        }

        .quiz-panel {
            text-align: center;
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .quiz-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .quiz-controls label {
            font-size: 1.1em;
            font-weight: 600;
        }

        #quizSheetCheckboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .quiz-sheet-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quiz-sheet-item input {
            cursor: pointer;
        }

        .quiz-sheet-item label {
            cursor: pointer;
            font-size: 1em;
            font-weight: normal;
        }

        .start-quiz-btn {
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 14px 32px;
            font-size: 1.3em;
            line-height: 1;
            cursor: pointer;
            font-weight: 600;
            height: auto;
            min-height: unset;
        }

        .start-quiz-btn:hover {
            background: #0b7dda;
        }

        .quiz-session {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
            min-height: 0;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .quiz-progress {
            font-size: 1.2em;
            color: #aaa;
        }

        .cancel-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 0.9em;
            cursor: pointer;
            font-weight: 600;
        }

        .cancel-btn:hover {
            background: #da190b;
        }

        .quiz-question {
            text-align: center;
        }

        .quiz-question-text {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
            font-size: 2.0em;
        }

        .quiz-chinese {
            font-size: 1.5em;
            font-weight: 600;
        }

        .quiz-pos {
            font-size: 0.8em;
            color: white;
            background: #2196F3;
            padding: 4px 10px;
            border-radius: 3px;
        }

        .quiz-input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: -25px;
            width: 100%;
            max-width: 500px;
            position: relative;
            flex: 1;
        }

        #quizInput {
            width: 100%;
            padding: 12px;
            font-size: 2.0em;
            border: 2px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }

        #quizInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #quizInput:disabled {
            background-color: #d3d3d3;
            color: #666;
        }

        .feedback-correct {
            background: #4CAF50;
            color: black;
            padding: 15px 30px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1.1em;
            text-align: center;
            min-width: 120px;
        }

        .feedback-wrong {
            color: red;
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
            font-size: 1.1em;
        }

        .feedback-error {
            background: #f44336;
            color: white;
            padding: 15px 30px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1.1em;
            text-align: center;
            min-width: 120px;
        }

        .quiz-bottom {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            margin-top: auto;
            padding-top: 0px;
        }

        .quiz-feedback {
            min-height: 60px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .quiz-feedback-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
        }

        .next-btn {
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 0.95em;
            cursor: pointer;
            font-weight: 600;
        }

        .next-btn:hover {
            background: #0b7dda;
        }

        .next-btn:active {
            transform: scale(0.98);
        }

        .retest-btn {
            background: #FF9800;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px 30px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: 600;
        }

        .retest-btn:hover {
            background: #F57C00;
        }

        .quiz-result {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .result-header {
            margin-bottom: 30px;
        }

        .result-header h2 {
            margin-bottom: 20px;
        }

        .result-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            width: 100%;
            flex: 0 0 auto;
            padding: 8px 12px 0 12px;
        }

        .result-score {
            font-size: 1.5em;
            font-weight: 600;
            color: #667eea;
            text-align: center;
            flex: 1;
            line-height: 1;
        }

        .result-words {
            height: calc(100% - 60px);
            overflow-y: auto;
            background: #3a3a52;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 0 12px 8px 12px;
        }

        .result-word {
            display: flex;
            border-bottom: 1px solid #4a4a60;
            cursor: pointer;
            transition: background 0.2s;
            height: auto;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            font-size: 0.85em;
            color: #b8b8b8;
        }

        .result-word.correct {
            /* background: #5a5a72; */
            background: #333; 
            color: #b8b8b8;
        }

        .result-word.wrong {
            background: #4a2020;
            color: #ff8080;
        }

        .result-word-star {
            flex: 0 0 30px;
            text-align: center;
            font-size: 1.5em;
            cursor: pointer;
            color: #ffa500;
        }

        .result-word-star:hover {
            transform: scale(1.2);
        }

        .result-word-tag {
            flex: 0 0 100px;
            background: #667eea;
            color: white;
            padding: 6px 6px;
            border-radius: 3px;
            font-size: 0.85em;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
        }

        .result-word-accuracy {
            flex: 0 0 50px;
            text-align: center;
            font-size: 1.25em;
            font-weight: bold;
            color: #667eea;
        }

        .result-word-english {
            flex: 0 0 250px;
            font-weight: bold;
            font-size: 1.5em;
        }

        .result-word-pos {
            flex: 0 0 50px;
            background: #c0c0c0;
            color: black;
            padding: 2px 2px;
            border-radius: 3px;
            text-align: center;
            font-size: 1.25em;
        }

        .result-word-chinese {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1.25em;
            color: lightgray;
        }

        .back-btn {
            background: #666;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 30px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #555;
        }

        .tag-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .tag-filter label {
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            white-space: nowrap;
        }

        .tag-filter-dropdown {
            position: relative;
        }

        .tag-dropdown-btn {
            background: gray;
            color: #333;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 1.1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 150px;
        }

        .tag-dropdown-btn:hover {
            background: lightgray; 
        }

        .tag-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: #4a4a62;
            border: 1px solid #5a5a72;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 100;
            min-width: 300px;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            display: none;
            margin-top: 4px;
            color: #b8b8b8;
        }

        .tag-dropdown-menu.active {
            display: block;
        }

        .sheet-item {
            border-bottom: 1px solid #5a5a72;
            position: relative;
        }

        .sheet-item-header {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 8px;
            background: #4a4a62;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            position: relative;
            color: #b8b8b8;
        }

        .sheet-item-header:hover {
            background: #5a5a72;
        }

        .sheet-item-header::after {
            content: '▶';
            position: absolute;
            right: 8px;
            font-size: 0.7em;
            color: #8a8a8a;
            transition: transform 0.2s;
        }

        .sheet-item-header.expanded::after {
            transform: rotate(90deg);
        }

        .sheet-toggle {
            width: 20px;
            text-align: center;
            font-size: 0.8em;
            color: #8a8a8a;
        }

        .sheet-item-header input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .sheet-name {
            flex: 1;
        }

        .sheet-group-header {
            position: sticky;
            top: 0;
            background: #4a4a62;
            border-bottom: 1px solid #5a5a72;
            padding: 6px 12px 6px 20px;
            z-index: 10;
            display: flex;
            gap: 8px;
            color: #b8b8b8;
        }

        .sheet-group-header button {
            padding: 4px 12px;
            font-size: 0.85em;
            border: 1px solid #5a5a72;
            background: #5a5a72;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 15px;
            color: #b8b8b8;
        }

        .sheet-group-header button:hover {
            background: #6a6a82;
        }

        .sheet-submenu {
            position: fixed;
            background: #4a4a62;
            border: 1px solid #5a5a72;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            min-width: 150px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            display: none;
            color: #b8b8b8;
        }

        .sheet-submenu.expanded {
            display: block;
        }

        .tag-checkbox-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            padding-left: 30px;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .tag-checkbox-item:hover {
            background: #5a5a72;
        }

        .tag-checkbox-item input[type="checkbox"] {
            cursor: pointer;
            accent-color: #667eea;
            width: 16px;
            height: 16px;
        }

        .search-filter {
            display: flex;
            align-items: center;
        }

        .search-input {
            background: gray;
            color: #333;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 1.1em;
            width: 200px;
            min-width: 0;
        }

        .search-input::placeholder {
            color: #333;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        .stats {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1em;
        }

        .settings-menu {
            position: relative;
            margin-left: auto;
        }

        .settings-btn {
            background: gray;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 1.4em;
            cursor: pointer;
        }

        .settings-btn:hover {
            background: lightgray;
        }

        .settings-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #4a4a62;
            border: 1px solid #5a5a72;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 100;
            min-width: 150px;
            margin-top: 4px;
            display: none;
        }

        .settings-dropdown.active {
            display: block;
        }

        .settings-option {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: none;
            border: none;
            color: #b8b8b8;
            text-align: left;
            cursor: pointer;
            font-size: 1.1em;
        }

        .settings-option:hover {
            background: #5a5a72;
        }

        .words-container {
            flex: 1;
            overflow-y: auto;
            background: #3a3a52;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            color: #b8b8b8;
        }

        .word-row {
            display: flex;
            border-bottom: 1px solid #4a4a60;
            cursor: pointer;
            transition: background 0.2s;
            height: auto;
            align-items: center;
            color: #b8b8b8;
        }

        .word-row:nth-child(odd) {
            background: #2a2a52;
        }

        .word-row:nth-child(even) {
            background: #323260;
        }

        .word-row:hover {
            background: #4a4a68;
        }

        .word-index {
            flex: 0 0 40px;
            text-align: center;
            font-size: 0.9em;
            color: #999;
            padding: 12px 8px;
            user-select: none;
            font-weight: 500;
        }

        .word-star {
            flex: 0 0 40px;
            text-align: center;
            font-size: 1.2em;
            cursor: pointer;
            padding: 12px 8px;
            user-select: none;
            color: #ffa500;
        }

        .word-star:hover {
            transform: scale(1.2);
        }

        .word-left {
            flex: 1;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            cursor: pointer;
            overflow: hidden;
        }

        .word-tag {
            background: #667eea;
            color: white;
            padding: 6px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: bold;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            line-height: 1.2;
            width: 100px;
            text-align: center;
        }

        .word-accuracy {
            flex-shrink: 0;
            font-size: 0.9em;
            font-weight: bold;
            color: #667eea;
            min-width: 40px;
            text-align: center;
        }

        .word-tag-sheet {
            font-size: 1em;
            min-height: 12px;
        }

        .word-tag-tag {
            font-size: 0.9em;
            min-height: 12px;
        }

        .word-word {
            font-weight: bold;
            color: #b8b8b8;
            min-width: 100px;
            flex-shrink: 0;
            font-size: 1.3em;
        }

        .word-phonetic {
            color: #ffa500;
            font-size: 0.9em;
            flex-shrink: 0;
            min-width: 120px;
        }

        .word-pos {
            background: #4a4a60;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            color: #b8b8b8;
            min-width: 50px;
            text-align: center;
            flex-shrink: 0;
        }

        .word-chinese {
            color: #b8b8b8;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .word-right {
            flex: 1;
            padding: 12px 15px;
            overflow: hidden;
            display: none;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            min-width: 0;
            color: #b8b8b8;
        }

        .word-right.show {
            display: flex;
        }

        .sentence-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 2px;
            padding: 4px 10px;
            font-size: 1.1em;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
            margin-right: 15px;
        }

        .sentence-btn:hover {
            background: #5568d3;
        }

        .content-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            min-width: 0;
            overflow-y: auto;
        }

        .content-text {
            color: #b8b8b8;
            font-size: 0.9em;
            line-height: 1.4;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #667eea #f5f5f5;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        .word-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .word-modal-content {
            background: #3a3a52;
            border-radius: 8px;
            width: 90%;
            max-width: 700px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            color: #b8b8b8;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .word-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #4a4a60;
        }

        .word-modal-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-index {
            font-weight: bold;
            color: #999;
            min-width: 25px;
            font-size: 0.9em;
        }

        .modal-star {
            font-size: 1.1em;
            cursor: pointer;
            color: #ffa500;
        }

        .modal-tag {
            background: #667eea;
            color: white;
            padding: 6px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
            min-width: 60px;
        }

        .modal-tag-sheet {
            font-size: 1em;
        }

        .modal-tag-tag {
            font-size: 0.9em;
        }

        .modal-accuracy {
            font-weight: bold;
            color: #667eea;
            min-width: 45px;
            text-align: center;
            font-size: 0.9em;
        }

        .modal-close-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 0.9em;
            cursor: pointer;
            font-weight: 600;
        }

        .modal-close-btn:hover {
            background: #da190b;
        }

</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="mode-selector">
                <label>模式：</label>
                <select id="modeSelect" onchange="changeMode(this.value)">
                    <option value="normal">一般</option>
                    <option value="review">複習</option>
                    <option value="quiz">測驗</option>
                </select>
            </div>
            <div class="tag-filter" id="tagFilterContainer">
                <label>選擇單元：</label>
                <div class="tag-filter-dropdown">
                    <button class="tag-dropdown-btn" onclick="toggleDropdown()">全部 <span>▼</span></button>
                    <div class="tag-dropdown-menu" id="tagDropdownMenu">
                        <div id="sheetGroupsContainer"></div>
                    </div>
                </div>
            </div>
            <div class="tag-filter" id="quizTagFilterContainer" style="display: none;">
                <label>選擇單元：</label>
                <div class="tag-filter-dropdown">
                    <button class="tag-dropdown-btn" onclick="toggleQuizDropdown()">全部 <span>▼</span></button>
                    <div class="tag-dropdown-menu" id="quizTagDropdownMenu">
                        <div id="quizSheetGroupsContainer"></div>
                    </div>
                </div>
            </div>
            <div class="search-filter" id="searchFilterContainer">
                <input type="text" id="searchInput" placeholder="搜尋單字..." class="search-input">
            </div>
            <div class="stats" id="stats"></div>
            <button class="refresh-btn" id="refreshBtn" onclick="refreshReview()" style="display: none; margin-left: auto;">刷新</button>
            <button class="start-quiz-btn" id="startQuizBtn" onclick="startQuiz()" style="display: none; margin-left: auto;">開始測驗</button>
            <div class="settings-menu" id="settingsMenuContainer">
                <button class="settings-btn" onclick="toggleSettingsMenu()">⚙️</button>
                <div class="settings-dropdown" id="settingsDropdown">
                    <button class="settings-option" onclick="clearHistory()">清除紀錄</button>
                </div>
            </div>
        </div>

        <div class="words-container" id="wordsContainer"></div>

        <!-- 測驗界面 -->
        <div class="quiz-container" id="quizContainer" style="display: none;">
            <!-- 測驗開始按鈕 -->
            <div style="display: none; justify-content: center; align-items: center; flex: 1;" id="quizStartPanel">
                <button class="start-quiz-btn" onclick="startQuiz()">開始測驗</button>
            </div>

            <!-- 測驗進行中 -->
            <div class="quiz-session" id="quizSession" style="display: none;">
                <div class="quiz-header">
                    <div class="quiz-progress">
                        <span id="quizProgress">1/10</span>
                    </div>
                    <button class="cancel-btn" onclick="cancelQuiz()">中斷</button>
                </div>
                <div class="quiz-question">
                    <div class="quiz-question-text">
                        <span id="quizChinese"></span>
                        <span id="quizPos" class="quiz-pos"></span>
                    </div>
                </div>
                <div class="quiz-input-area">
                    <input type="text" id="quizInput" placeholder="輸入英文單字" onkeypress="handleQuizInput(event)">
                    <div id="quizAnswer" style="display: none; font-size: 1.5em; font-weight: 600; color: red; margin-top: 5px;"></div>
                    <div class="quiz-bottom">
                        <div class="quiz-feedback" id="quizFeedback"></div>
                        <div style="display: flex; gap: 10px; width: 100%; justify-content: center;">
                            <button class="retest-btn" id="retestBtn" onclick="retestWord()" style="display: none;">重測</button>
                            <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display: none; margin-left: auto;">下一題</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 測驗結果 -->
            <div class="quiz-result" id="quizResult" style="display: none;">
                <div class="result-header-top">
                    <div class="result-score" id="resultScore"></div>
                    <button class="back-btn" onclick="backToQuizPanel()">返回</button>
                </div>
                <div class="result-words" id="resultWords"></div>
            </div>
        </div>

        <!-- 單字視窗 -->
        <div class="word-modal" id="wordModal" style="display: none;">
            <div class="word-modal-content">
                <!-- 頁頭 -->
                <div class="word-modal-header">
                    <div class="word-modal-left">
                        <span id="modalWordIndex" class="modal-index"></span>
                        <span id="modalWordStar" class="modal-star">☆</span>
                        <div id="modalWordTag" class="modal-tag">
                            <div class="modal-tag-sheet"></div>
                            <div class="modal-tag-tag"></div>
                        </div>
                        <span id="modalWordAccuracy" class="modal-accuracy"></span>
                    </div>
                    <button class="modal-close-btn" onclick="closeWordModal()">離開</button>
                </div>

                <!-- 單字信息 -->
                <div class="word-modal-body">
                    <div class="modal-word" id="modalWord"></div>
                    <div class="modal-phonetic" id="modalPhonetic"></div>
                    <div class="modal-info">
                        <span id="modalPos" class="modal-pos"></span>
                        <span id="modalChinese" class="modal-chinese"></span>
                    </div>
                    <div class="modal-example" id="modalExample"></div>
                    <div class="modal-translation" id="modalTranslation"></div>
                </div>

                <!-- 導航按鈕 -->
                <div class="word-modal-footer">
                    <button class="modal-nav-btn" onclick="previousWord()">上一個</button>
                    <button class="modal-nav-btn" onclick="nextWord()">下一個</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allWords = [];
        let sheetData = {};
        let selectedTags = new Map(); // {sheetName: Set<tag>}
        let currentMode = 'normal'; // 'normal' or 'review' or 'quiz'
        let searchKeyword = ''; // 搜尋關鍵詞
        let normalModeSheetNames = new Set(); // 記錄一般/複習模式的 sheet 名稱
        let normalModeCheckStates = {}; // 保存 normal 模式 sheet 的狀態 {sheetName: checked}
        let normalModeTagStates = {}; // 保存 normal 模式 tag 的狀態 {sheetName: {tagName: checked}}
        let quizModeCheckStates = {}; // 保存 quiz 模式 sheet 的狀態 {sheetName: checked}
        let quizModeTagStates = {}; // 保存 quiz 模式 tag 的狀態 {sheetName: {tagName: checked}}
        let quizModeFilterStates = {}; // 保存 quiz 模式的過濾狀態 {starFilter, accuracyFilter, accuracyThreshold}

        // 測驗相關變數
        let quizWords = [];
        let quizIndex = 0;
        let quizResults = [];

        // 單字視窗相關變數
        let currentFilteredWords = [];
        let modalCurrentWordIndex = -1;

        fetch('output.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                sheetData = data;
                allWords = [];

                // 建立分組下拉選單
                const container = document.getElementById('sheetGroupsContainer');

                // 添加星號過濾（只在複習模式顯示）
                const starItem = document.createElement('div');
                starItem.className = 'tag-checkbox-item';
                starItem.id = 'review-star-filter-item';
                starItem.style.borderBottom = '1px solid #eee';
                starItem.style.paddingBottom = '10px';
                starItem.style.marginBottom = '10px';
                starItem.style.display = 'none';

                const starCheckbox = document.createElement('input');
                starCheckbox.type = 'checkbox';
                starCheckbox.id = 'normal-star-filter';

                const starLabel = document.createElement('span');
                starLabel.textContent = '☆ 有星號';

                starItem.appendChild(starCheckbox);
                starItem.appendChild(starLabel);
                starCheckbox.addEventListener('change', updateFilter);
                starItem.onclick = (e) => {
                    if (e.target !== starCheckbox) {
                        starCheckbox.checked = !starCheckbox.checked;
                        updateFilter();
                    }
                };
                container.appendChild(starItem);

                // 添加正確率過濾（只在複習模式顯示）
                const accuracyFilterContainer = document.createElement('div');
                accuracyFilterContainer.className = 'tag-checkbox-item';
                accuracyFilterContainer.id = 'review-accuracy-filter-item';
                accuracyFilterContainer.style.borderBottom = '1px solid #eee';
                accuracyFilterContainer.style.paddingBottom = '10px';
                accuracyFilterContainer.style.marginBottom = '10px';
                accuracyFilterContainer.style.display = 'none';

                const accuracyCheckbox = document.createElement('input');
                accuracyCheckbox.type = 'checkbox';
                accuracyCheckbox.id = 'normal-accuracy-filter-checkbox';

                const accuracyLabel = document.createElement('span');
                accuracyLabel.textContent = '正確率';

                const accuracySelect = document.createElement('select');
                accuracySelect.id = 'normal-accuracy-filter-select';
                accuracySelect.style.padding = '4px 8px';
                accuracySelect.style.borderRadius = '3px';
                accuracySelect.style.border = '1px solid #ddd';
                accuracySelect.style.cursor = 'pointer';
                accuracySelect.style.marginLeft = '5px';

                ['<=100%', '<=80%', '<=60%', '<=40%', '<=20%'].forEach(threshold => {
                    const option = document.createElement('option');
                    option.value = threshold;
                    option.textContent = threshold;
                    accuracySelect.appendChild(option);
                });

                accuracyCheckbox.addEventListener('change', updateFilter);
                accuracySelect.addEventListener('change', updateFilter);

                accuracyFilterContainer.appendChild(accuracyCheckbox);
                accuracyFilterContainer.appendChild(accuracyLabel);
                accuracyFilterContainer.appendChild(accuracySelect);

                accuracyFilterContainer.onclick = (e) => {
                    if (e.target !== accuracyCheckbox && e.target !== accuracySelect) {
                        accuracyCheckbox.checked = !accuracyCheckbox.checked;
                        updateFilter();
                    }
                };

                container.appendChild(accuracyFilterContainer);

                Object.entries(sheetData).forEach(([sheetName, words]) => {
                    if (Array.isArray(words)) {
                        // 記錄 normal mode 的 sheet 名稱
                        normalModeSheetNames.add(sheetName);

                        // 建立該sheet的所有tag
                        const sheetTags = [...new Set(words.map(w => w.tag))];

                        // 添加到allWords
                        allWords = allWords.concat(words);

                        // 初始化selectedTags中該sheet的所有tag
                        selectedTags.set(sheetName, new Set(sheetTags));

                        // 建立sheet項目
                        const sheetItem = document.createElement('div');
                        sheetItem.className = 'sheet-item normal-sheet-item';

                        // Sheet標題（可展開）
                        const sheetHeader = document.createElement('div');
                        sheetHeader.className = 'sheet-item-header';
                        sheetHeader.dataset.sheetName = sheetName;

                        const toggleSpan = document.createElement('span');
                        toggleSpan.className = 'sheet-toggle';
                        toggleSpan.textContent = '▶';

                        const sheetCheckbox = document.createElement('input');
                        sheetCheckbox.type = 'checkbox';
                        sheetCheckbox.checked = true;
                        sheetCheckbox.dataset.sheetName = sheetName;
                        sheetCheckbox.className = 'normal-sheet-checkbox';
                        sheetCheckbox.onchange = updateFilter;
                        sheetCheckbox.onclick = (e) => {
                            e.stopPropagation();
                        };

                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'sheet-name';
                        nameSpan.textContent = sheetName;

                        sheetHeader.appendChild(sheetCheckbox);
                        sheetHeader.appendChild(nameSpan);

                        // 創建獨立的第二選單
                        const sheetSubmenu = document.createElement('div');
                        sheetSubmenu.className = 'sheet-submenu';
                        sheetSubmenu.dataset.sheetName = sheetName;
                        document.body.appendChild(sheetSubmenu);

                        // 按鈕行
                        const buttonsRow = document.createElement('div');
                        buttonsRow.className = 'sheet-group-header';

                        const selectBtn = document.createElement('button');
                        selectBtn.textContent = '全選';
                        selectBtn.onclick = function(e) {
                            e.stopPropagation();
                            selectAllInSheet(e, sheetName);
                        };

                        const clearBtn = document.createElement('button');
                        clearBtn.textContent = '清除';
                        clearBtn.onclick = function(e) {
                            e.stopPropagation();
                            clearAllInSheet(e, sheetName);
                        };

                        buttonsRow.appendChild(selectBtn);
                        buttonsRow.appendChild(clearBtn);
                        sheetSubmenu.appendChild(buttonsRow);

                        // 該sheet的所有tag
                        sheetTags.forEach(tag => {
                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.value = tag;
                            checkbox.checked = true;
                            checkbox.dataset.sheet = sheetName;
                            checkbox.className = 'normal-tag-checkbox';
                            checkbox.onchange = updateFilter;
                            checkbox.onclick = (e) => {
                                e.stopPropagation();
                            };

                            const label = document.createElement('div');
                            label.className = 'tag-checkbox-item';
                            label.appendChild(checkbox);
                            const span = document.createElement('span');
                            span.textContent = tag;
                            label.appendChild(span);

                            label.onclick = (e) => {
                                e.stopPropagation();
                                checkbox.checked = !checkbox.checked;
                                updateFilter();
                            };

                            sheetSubmenu.appendChild(label);
                        });

                        // Sheet展開/收起邏輯 - 顯示/隱藏獨立的submenu
                        sheetHeader.onclick = (e) => {
                            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                                e.stopPropagation();

                                // 關閉其他所有的submenu
                                document.querySelectorAll('.sheet-submenu.expanded').forEach(submenu => {
                                    if (submenu !== sheetSubmenu) {
                                        submenu.classList.remove('expanded');
                                    }
                                });

                                // Toggle當前的submenu
                                sheetSubmenu.classList.toggle('expanded');

                                // 如果打開，計算位置並顯示在sheetHeader的右邊
                                if (sheetSubmenu.classList.contains('expanded')) {
                                    const rect = sheetHeader.getBoundingClientRect();
                                    sheetSubmenu.style.top = rect.top + 'px';
                                    sheetSubmenu.style.left = (rect.right + 5) + 'px';
                                }
                            }
                        };

                        sheetItem.appendChild(sheetHeader);
                        container.appendChild(sheetItem);
                    }
                });

                renderWords();

                // 搜尋輸入框事件監聽
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('input', (e) => {
                        searchKeyword = e.target.value.toLowerCase();
                        renderWords();
                    });
                }

                // 點擊頁面其他地方時關閉所有的submenu
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.sheet-item-header') && !e.target.closest('.sheet-submenu')) {
                        document.querySelectorAll('.sheet-submenu.expanded').forEach(submenu => {
                            submenu.classList.remove('expanded');
                        });
                    }
                });
            })
            .catch(e => {
                document.getElementById('wordsContainer').innerHTML = '❌ 無法讀取 output.json';
            });

        function changeMode(mode) {
            // 離開 normal/review 模式時，保存 checkbox 狀態
            if (currentMode === 'normal' || currentMode === 'review') {
                normalModeCheckStates = {};
                normalModeTagStates = {};
                document.querySelectorAll('input.normal-sheet-checkbox').forEach(checkbox => {
                    normalModeCheckStates[checkbox.dataset.sheetName] = checkbox.checked;
                });
                document.querySelectorAll('input.normal-tag-checkbox').forEach(checkbox => {
                    const sheetName = checkbox.dataset.sheet;
                    if (!(sheetName in normalModeTagStates)) {
                        normalModeTagStates[sheetName] = {};
                    }
                    normalModeTagStates[sheetName][checkbox.value] = checkbox.checked;
                });
            }

            // 離開 quiz 模式時，保存 checkbox 狀態和過濾器狀態
            if (currentMode === 'quiz') {
                quizModeCheckStates = {};
                quizModeTagStates = {};
                quizModeFilterStates = {};
                document.querySelectorAll('input.quiz-sheet-checkbox').forEach(checkbox => {
                    quizModeCheckStates[checkbox.dataset.sheetName] = checkbox.checked;
                });
                document.querySelectorAll('input.quiz-tag-checkbox').forEach(checkbox => {
                    const sheetName = checkbox.dataset.sheet;
                    if (!(sheetName in quizModeTagStates)) {
                        quizModeTagStates[sheetName] = {};
                    }
                    quizModeTagStates[sheetName][checkbox.value] = checkbox.checked;
                });
                // 保存過濾器狀態
                const starCheckbox = document.getElementById('quiz-star-filter');
                const accuracyCheckbox = document.getElementById('quiz-accuracy-filter-checkbox');
                const accuracySelect = document.getElementById('quiz-accuracy-filter-select');
                if (starCheckbox) {
                    quizModeFilterStates.starFilter = starCheckbox.checked;
                }
                if (accuracyCheckbox) {
                    quizModeFilterStates.accuracyFilter = accuracyCheckbox.checked;
                }
                if (accuracySelect) {
                    quizModeFilterStates.accuracyThreshold = accuracySelect.value;
                }
            }

            currentMode = mode;
            const wordsContainer = document.getElementById('wordsContainer');
            const quizContainer = document.getElementById('quizContainer');
            const tagFilterContainer = document.getElementById('tagFilterContainer');
            const quizTagFilterContainer = document.getElementById('quizTagFilterContainer');
            const searchFilterContainer = document.getElementById('searchFilterContainer');
            const refreshBtn = document.getElementById('refreshBtn');
            const startQuizBtn = document.getElementById('startQuizBtn');
            const stats = document.getElementById('stats');
            const settingsMenuContainer = document.getElementById('settingsMenuContainer');

            // 清除搜尋關鍵詞
            searchKeyword = '';
            if (searchFilterContainer) {
                const searchInput = searchFilterContainer.querySelector('input');
                if (searchInput) searchInput.value = '';
            }

            if (mode === 'review') {
                wordsContainer.style.display = 'block';
                quizContainer.style.display = 'none';
                tagFilterContainer.style.display = 'flex';
                quizTagFilterContainer.style.display = 'none';
                searchFilterContainer.style.display = 'none';
                refreshBtn.style.display = 'block';
                startQuizBtn.style.display = 'none';
                stats.style.display = 'block';
                settingsMenuContainer.style.display = 'none';
                // 改變標籤為「過濾單元」
                tagFilterContainer.querySelector('label').textContent = '過濾單元：';
                // 隱藏所有sheet項目，只顯示過濾器
                document.querySelectorAll('.normal-sheet-item').forEach(item => {
                    item.style.display = 'none';
                });
                // 顯示複習模式的過濾器
                const starFilterItem = document.getElementById('review-star-filter-item');
                const accuracyFilterItem = document.getElementById('review-accuracy-filter-item');
                if (starFilterItem) starFilterItem.style.display = 'flex';
                if (accuracyFilterItem) accuracyFilterItem.style.display = 'flex';
                updateDropdownButton();
                renderWords();
            } else if (mode === 'quiz') {
                wordsContainer.style.display = 'none';
                quizContainer.style.display = 'flex';
                tagFilterContainer.style.display = 'none';
                quizTagFilterContainer.style.display = 'flex';
                searchFilterContainer.style.display = 'none';
                refreshBtn.style.display = 'none';
                startQuizBtn.style.display = 'none';
                stats.style.display = 'block';
                settingsMenuContainer.style.display = 'none';
                document.getElementById('quizStartPanel').style.display = 'flex';
                document.getElementById('quizSession').style.display = 'none';
                document.getElementById('quizResult').style.display = 'none';
                initQuizPanel();
            } else {
                wordsContainer.style.display = 'block';
                quizContainer.style.display = 'none';
                tagFilterContainer.style.display = 'flex';
                quizTagFilterContainer.style.display = 'none';
                searchFilterContainer.style.display = 'flex';
                refreshBtn.style.display = 'none';
                startQuizBtn.style.display = 'none';
                stats.style.display = 'block';
                settingsMenuContainer.style.display = 'block';
                // 改變標籤回「選擇單元」
                tagFilterContainer.querySelector('label').textContent = '選擇單元：';
                // 顯示所有sheet項目
                document.querySelectorAll('.normal-sheet-item').forEach(item => {
                    item.style.display = 'block';
                });
                // 隱藏複習模式的過濾器
                const starFilterItem = document.getElementById('review-star-filter-item');
                const accuracyFilterItem = document.getElementById('review-accuracy-filter-item');
                if (starFilterItem) starFilterItem.style.display = 'none';
                if (accuracyFilterItem) accuracyFilterItem.style.display = 'none';

                // 恢復 normal 模式的 sheet 和 tag 狀態
                document.querySelectorAll('input.normal-sheet-checkbox').forEach(checkbox => {
                    const sheetName = checkbox.dataset.sheetName;
                    if (sheetName in normalModeCheckStates) {
                        checkbox.checked = normalModeCheckStates[sheetName];
                    }
                });
                document.querySelectorAll('input.normal-tag-checkbox').forEach(checkbox => {
                    const sheetName = checkbox.dataset.sheet;
                    const tagName = checkbox.value;
                    if (sheetName in normalModeTagStates && tagName in normalModeTagStates[sheetName]) {
                        checkbox.checked = normalModeTagStates[sheetName][tagName];
                    } else {
                        // 預設為勾選
                        checkbox.checked = true;
                    }
                });

                updateDropdownButton();
                renderWords();
            }
        }

        function refreshReview() {
            // 刷新複習模式的單詞
            renderWords();
        }

        function toggleDropdown() {
            const menu = document.getElementById('tagDropdownMenu');
            menu.classList.toggle('active');
        }

        function toggleQuizDropdown() {
            const menu = document.getElementById('quizTagDropdownMenu');
            menu.classList.toggle('active');
        }

        function selectAllInSheet(event, sheetName) {
            event.stopPropagation();
            const checkboxes = document.querySelectorAll(`input[data-sheet="${sheetName}"]`);
            checkboxes.forEach(checkbox => {
                checkbox.checked = true;
            });
            updateFilter();
        }

        function clearAllInSheet(event, sheetName) {
            event.stopPropagation();
            // 只清除該 sheet 的 checkbox
            const checkboxes = document.querySelectorAll(`input[data-sheet="${sheetName}"]`);
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            updateFilter();
        }

        function updateFilter() {
            // 為每個sheet更新selected tags
            selectedTags.forEach((tags, sheetName) => {
                tags.clear();
            });

            // 先檢查sheet checkbox，如果unchecked則skip該sheet
            const enabledSheets = new Set();
            document.querySelectorAll('input.normal-sheet-checkbox').forEach(sheetCheckbox => {
                if (sheetCheckbox.checked) {
                    enabledSheets.add(sheetCheckbox.dataset.sheetName);
                }
            });

            // 只處理enabled sheets的tag checkbox（只選 normal 模式的）
            document.querySelectorAll('input.normal-tag-checkbox').forEach(checkbox => {
                if (checkbox.checked) {
                    const sheetName = checkbox.dataset.sheet;
                    if (enabledSheets.has(sheetName) && selectedTags.has(sheetName)) {
                        selectedTags.get(sheetName).add(checkbox.value);
                    }
                }
            });
            updateDropdownButton();
            renderWords();
        }

        function updateDropdownButton() {
            const btn = document.querySelector('.tag-dropdown-btn');
            let totalSelected = 0;
            selectedTags.forEach(tags => {
                totalSelected += tags.size;
            });
            if (currentMode === 'review') {
                // 複習模式：根據勾選的過濾器顯示
                const starCheckbox = document.getElementById('normal-star-filter');
                const accuracyCheckbox = document.getElementById('normal-accuracy-filter-checkbox');
                const accuracySelect = document.getElementById('normal-accuracy-filter-select');

                let displayText = '';
                if (starCheckbox && starCheckbox.checked) {
                    displayText += '星號';
                }
                if (accuracyCheckbox && accuracyCheckbox.checked && accuracySelect) {
                    if (displayText) displayText += ' ; ';
                    displayText += accuracySelect.value;
                }

                btn.innerHTML = displayText ? `${displayText} <span>▼</span>` : '<span>▼</span>';
            } else {
                // 一般模式
                if (totalSelected === 0) {
                    btn.innerHTML = '清除 <span>▼</span>';
                } else {
                    btn.innerHTML = `已選擇 ${totalSelected} 個 <span>▼</span>`;

        document.addEventListener('click', (e) => {
            const filter = document.querySelector('#tagFilterContainer');
            if (filter && !filter.contains(e.target)) {
                document.getElementById('tagDropdownMenu').classList.remove('active');
            }
            const quizFilter = document.querySelector('#quizTagFilterContainer');
            if (quizFilter && !quizFilter.contains(e.target)) {
                document.getElementById('quizTagDropdownMenu').classList.remove('active');
            }
        });

        function playPronunciation(word) {
            const SpeechSynthesisUtterance = window.SpeechSynthesisUtterance || window.webkitSpeechSynthesisUtterance;
            const speechSynthesis = window.speechSynthesis || window.webkitSpeechSynthesis;

            if (!SpeechSynthesisUtterance || !speechSynthesis) {
                console.log('Web Speech API not supported');
                return;
            }

            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        function renderWords() {
            const container = document.getElementById('wordsContainer');
            container.innerHTML = '';

            // 檢查enabled sheets
            const enabledSheets = new Set();
            document.querySelectorAll('input[data-sheet-name]').forEach(sheetCheckbox => {
                if (sheetCheckbox.checked) {
                    enabledSheets.add(sheetCheckbox.dataset.sheetName);
                }
            });

            // 檢查星號和正確率過濾（只在複習模式中）
            let filterByStar = false;
            let filterByAccuracy = null;
            if (currentMode === 'review') {
                const starCheckbox = document.getElementById('normal-star-filter');
                filterByStar = starCheckbox ? starCheckbox.checked : false;

                const accuracyCheckbox = document.getElementById('normal-accuracy-filter-checkbox');
                const accuracySelect = document.getElementById('normal-accuracy-filter-select');
                if (accuracyCheckbox && accuracyCheckbox.checked && accuracySelect) {
                    const threshold = accuracySelect.value.replace(/[<=%]/g, '');
                    filterByAccuracy = parseInt(threshold);
                }
            }

            // 根據模式和選中的sheet+tag過濾單字
            let filteredWords;
            if (currentMode === 'review') {
                // 複習模式：根據勾選的過濾器篩選
                // 如果都沒勾選，不顯示任何單字
                if (!filterByStar && filterByAccuracy === null) {
                    filteredWords = [];
                } else {
                    filteredWords = allWords.filter(word => {
                        const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;

                        // 如果勾選星號過濾，檢查是否有星號
                        if (filterByStar) {
                            if (localStorage.getItem(`favorite_${wordKey}`) !== 'true') {
                                return false;
                            }
                        }

                        // 如果勾選正確率過濾，檢查是否符合條件
                        if (filterByAccuracy !== null) {
                            const historyKey = `quizHistory_${word.sheet}/${word.tag}/${word.單字}`;
                            const history = JSON.parse(localStorage.getItem(historyKey)) || [];
                            if (history.length === 0) {
                                return false;
                            }
                            const correct = history.filter(v => v).length;
                            const accuracy = Math.round((correct / history.length) * 100);
                            if (!(accuracy <= filterByAccuracy)) {
                                return false;
                            }
                        }

                        return true;
                    });
                }

                // 複習模式：如果勾選正確率過濾，按正確率從低到高排序
                if (filterByAccuracy !== null) {
                    filteredWords.sort((a, b) => {
                        const historyKeyA = `quizHistory_${a.sheet}/${a.tag}/${a.單字}`;
                        const historyA = JSON.parse(localStorage.getItem(historyKeyA)) || [];
                        const correctA = historyA.filter(v => v).length;
                        const accuracyA = historyA.length > 0 ? Math.round((correctA / historyA.length) * 100) : 0;

                        const historyKeyB = `quizHistory_${b.sheet}/${b.tag}/${b.單字}`;
                        const historyB = JSON.parse(localStorage.getItem(historyKeyB)) || [];
                        const correctB = historyB.filter(v => v).length;
                        const accuracyB = historyB.length > 0 ? Math.round((correctB / historyB.length) * 100) : 0;

                        return accuracyA - accuracyB;
                    });
                }
            } else {
                // 一般模式：根據sheet+tag過濾
                filteredWords = allWords.filter(word => {
                    // 如果sheet checkbox unchecked，忽略該sheet
                    if (!enabledSheets.has(word.sheet)) {
                        return false;
                    }
                    const sheetTags = selectedTags.get(word.sheet);
                    if (!(sheetTags && sheetTags.has(word.tag))) {
                        return false;
                    }
                    // 如果勾選星號過濾，只顯示有星號的
                    if (filterByStar) {
                        const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                        if (localStorage.getItem(`favorite_${wordKey}`) !== 'true') {
                            return false;
                        }
                    }
                    // 如果勾選正確率過濾，檢查是否符合條件
                    if (filterByAccuracy !== null) {
                        const historyKey = `quizHistory_${word.sheet}/${word.tag}/${word.單字}`;
                        const history = JSON.parse(localStorage.getItem(historyKey)) || [];
                        if (history.length === 0) {
                            return false;
                        }
                        const correct = history.filter(v => v).length;
                        const accuracy = Math.round((correct / history.length) * 100);
                        if (!(accuracy <= filterByAccuracy)) {
                            return false;
                        }
                    }
                    // 搜尋過濾：只檢查單字（只在一般模式使用）
                    if (currentMode === 'normal' && searchKeyword) {
                        if (!word.單字.toLowerCase().startsWith(searchKeyword)) {
                            return false;
                        }
                    }
                    return true;
                });
            }

            document.getElementById('stats').textContent = `共 ${filteredWords.length} 項`;

            filteredWords.forEach((word, index) => {
                const row = document.createElement('div');
                row.className = 'word-row';

                // 創建星號按鈕
                const starBtn = document.createElement('div');
                starBtn.className = 'word-star';
                const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                const isFavorited = localStorage.getItem(`favorite_${wordKey}`) === 'true';
                starBtn.textContent = isFavorited ? '★' : '☆';
                starBtn.dataset.wordKey = wordKey;
                starBtn.onclick = (e) => {
                    e.stopPropagation();
                    const isFav = localStorage.getItem(`favorite_${wordKey}`) === 'true';
                    if (isFav) {
                        localStorage.removeItem(`favorite_${wordKey}`);
                        starBtn.textContent = '☆';
                    } else {
                        localStorage.setItem(`favorite_${wordKey}`, 'true');
                        starBtn.textContent = '★';
                    }
                };

                // 計算正確率
                const historyKey = `quizHistory_${word.sheet}/${word.tag}/${word.單字}`;
                const history = JSON.parse(localStorage.getItem(historyKey)) || [];
                let accuracyDisplay = '--';
                if (history.length > 0) {
                    const correct = history.filter(v => v).length;
                    const accuracy = Math.round((correct / history.length) * 100);
                    accuracyDisplay = `${accuracy}%`;
                }

                // 創建左側內容
                const wordLeft = document.createElement('div');
                wordLeft.className = 'word-left';
                wordLeft.onclick = () => {
                    playPronunciation(word.單字);
                    // 隱藏所有其他打開的例句
                    document.querySelectorAll('.word-right.show').forEach(item => {
                        if (item !== wordRight) {
                            item.classList.remove('show');
                        }
                    });
                };
                wordLeft.innerHTML = `
                    ${word.sheet || word.tag ? `<span class="word-tag"><div class="word-tag-sheet">${word.sheet || ''}</div><div class="word-tag-tag">${word.tag || ''}</div></span>` : ''}
                    <span class="word-accuracy">${accuracyDisplay}</span>
                    <span class="word-word">${word.單字}</span>
                    <span class="word-phonetic">${word.音標}</span>
                    <span class="word-pos">${word.詞性}</span>
                    <span class="word-chinese">${word.中文}</span>
                `;

                // 創建例句按鈕
                const sentenceBtn = document.createElement('button');
                sentenceBtn.className = 'sentence-btn';
                sentenceBtn.textContent = 'ⓘ';
                sentenceBtn.onclick = (e) => {
                    e.stopPropagation();
                    // 在 filteredWords 中查找當前單字的索引
                    const wordIndex = filteredWords.findIndex(w =>
                        w.sheet === word.sheet && w.tag === word.tag && w.單字 === word.單字
                    );
                    openWordModal(wordIndex, filteredWords);
                };

                // 創建右側內容
                const wordRight = document.createElement('div');
                wordRight.className = 'word-right';
                wordRight.innerHTML = `
                    <div class="content-half">
                        <div class="content-text">${word.例句}</div>
                    </div>
                    <div class="content-half">
                        <div class="content-text">${word.翻譯}</div>
                    </div>
                `;

                // 創建序號
                const indexDiv = document.createElement('div');
                indexDiv.className = 'word-index';
                indexDiv.textContent = index + 1;

                // 添加 data 屬性用於識別單字
                row.dataset.wordKey = wordKey;
                row.dataset.filteredIndex = index;

                row.appendChild(indexDiv);
                row.appendChild(starBtn);
                row.appendChild(wordLeft);
                row.appendChild(sentenceBtn);
                row.appendChild(wordRight);
                container.appendChild(row);
            });
        }
