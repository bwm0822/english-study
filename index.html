<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>英文學習系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            color: white;
            padding: 10px 0;
        }

        header h1 {
            font-size: 1.8em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .tag-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .tag-filter label {
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            white-space: nowrap;
        }

        .tag-filter-dropdown {
            position: relative;
        }

        .tag-dropdown-btn {
            background: white;
            color: #333;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.9em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 150px;
        }

        .tag-dropdown-btn:hover {
            background: #f5f5f5;
        }

        .tag-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 100;
            min-width: 200px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            margin-top: 4px;
        }

        .tag-dropdown-menu.active {
            display: block;
        }

        .tag-dropdown-header {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 8px;
        }

        .tag-dropdown-header button {
            flex: 1;
            padding: 4px 8px;
            font-size: 0.85em;
            border: 1px solid #ddd;
            background: white;
            border-radius: 3px;
            cursor: pointer;
        }

        .tag-dropdown-header button:hover {
            background: #f5f5f5;
        }

        .tag-checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 8px;
            cursor: pointer;
        }

        .tag-checkbox-item:hover {
            background: #f9f9f9;
        }

        .tag-checkbox-item input[type="checkbox"] {
            cursor: pointer;
            accent-color: #667eea;
        }

        .stats {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
        }

        .words-container {
            flex: 1;
            overflow-y: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .word-row {
            display: flex;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
            height: auto;
            align-items: center;
        }

        .word-row:nth-child(odd) {
            background: #e3f2fd;
        }

        .word-row:nth-child(even) {
            background: #f5f9ff;
        }

        .word-row:hover {
            background: #bbdefb;
        }

        .word-left {
            flex: 1;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            cursor: pointer;
        }

        .word-tag {
            background: #667eea;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75em;
            font-weight: bold;
            flex-shrink: 0;
        }

        .word-word {
            font-weight: bold;
            color: #333;
            min-width: 100px;
            flex-shrink: 0;
        }

        .word-phonetic {
            color: #667eea;
            font-size: 0.9em;
            min-width: 120px;
            flex-shrink: 0;
        }

        .word-pos {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            color: #666;
            min-width: 50px;
            text-align: center;
            flex-shrink: 0;
        }

        .word-chinese {
            color: #555;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .word-right {
            width: 50%;
            border-left: 1px solid #ddd;
            padding: 12px 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .content-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            min-width: 0;
            overflow-y: auto;
        }

        .content-text {
            color: #333;
            font-size: 0.9em;
            line-height: 1.4;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 2px;
        }

        @media (max-width: 1024px) {
            .word-phonetic {
                display: none;
            }

            .word-right {
                width: 100%;
                border-left: none;
                border-top: 1px solid #ddd;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 英文學習系統</h1>
        </header>

        <div class="controls">
            <div class="tag-filter">
                <label>選擇單元：</label>
                <div class="tag-filter-dropdown">
                    <button class="tag-dropdown-btn" onclick="toggleDropdown()">全部 <span>▼</span></button>
                    <div class="tag-dropdown-menu" id="tagDropdownMenu">
                        <div class="tag-dropdown-header">
                            <button onclick="selectAllTags()">全部</button>
                            <button onclick="clearAllTags()">清除</button>
                        </div>
                        <div id="tagCheckboxList"></div>
                    </div>
                </div>
            </div>
            <div class="stats" id="stats"></div>
        </div>

        <div class="words-container" id="wordsContainer"></div>
    </div>

    <script>
        let allWords = [];
        let uniqueTags = [];
        let selectedTags = new Set();

        fetch('output.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                allWords = data;

                // 提取所有唯一的tag，保持原始順序
                const tagOrder = {};
                allWords.forEach(w => {
                    if (w.tag && !(w.tag in tagOrder)) {
                        tagOrder[w.tag] = Object.keys(tagOrder).length;
                    }
                });
                uniqueTags = Object.keys(tagOrder).sort((a, b) => tagOrder[a] - tagOrder[b]);
                selectedTags = new Set(uniqueTags);

                // 建立勾選式下拉選單
                const checkboxList = document.getElementById('tagCheckboxList');
                uniqueTags.forEach(tag => {
                    const item = document.createElement('div');
                    item.className = 'tag-checkbox-item';
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.value = tag;
                    checkbox.checked = true;
                    checkbox.onchange = updateFilter;
                    const span = document.createElement('span');
                    span.textContent = tag;
                    item.appendChild(checkbox);
                    item.appendChild(span);
                    item.onclick = () => {
                        checkbox.checked = !checkbox.checked;
                        updateFilter();
                    };
                    checkboxList.appendChild(item);
                });

                renderWords();
            })
            .catch(e => {
                document.getElementById('wordsContainer').innerHTML = '❌ 無法讀取 output.json';
            });

        function toggleDropdown() {
            const menu = document.getElementById('tagDropdownMenu');
            menu.classList.toggle('active');
        }

        function selectAllTags() {
            selectedTags.clear();
            uniqueTags.forEach(tag => selectedTags.add(tag));
            document.querySelectorAll('.tag-checkbox-item input').forEach(checkbox => {
                checkbox.checked = true;
            });
            updateFilter();
        }

        function clearAllTags() {
            selectedTags.clear();
            document.querySelectorAll('.tag-checkbox-item input').forEach(checkbox => {
                checkbox.checked = false;
            });
            updateFilter();
        }

        function updateFilter() {
            selectedTags.clear();
            document.querySelectorAll('.tag-checkbox-item input').forEach(checkbox => {
                if (checkbox.checked) {
                    selectedTags.add(checkbox.value);
                }
            });
            updateDropdownButton();
            renderWords();
        }

        function updateDropdownButton() {
            const btn = document.querySelector('.tag-dropdown-btn');
            let text = '';
            if (selectedTags.size === 0) {
                text = '清除';
            } else if (selectedTags.size === uniqueTags.length) {
                text = '全部';
            } else {
                text = `已選擇 ${selectedTags.size} 個`;
            }
            btn.innerHTML = `${text} <span>▼</span>`;
        }

        document.addEventListener('click', (e) => {
            const filter = document.querySelector('.tag-filter');
            if (!filter.contains(e.target)) {
                document.getElementById('tagDropdownMenu').classList.remove('active');
            }
        });

        function playPronunciation(word) {
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        function renderWords() {
            const container = document.getElementById('wordsContainer');
            container.innerHTML = '';

            // 根據選中的tag過濾單字
            const filteredWords = allWords.filter(word =>
                selectedTags.size === 0 || !word.tag || selectedTags.has(word.tag)
            );

            document.getElementById('stats').textContent = `共 ${filteredWords.length} 項`;

            filteredWords.forEach((word, index) => {
                const row = document.createElement('div');
                row.className = 'word-row';
                row.innerHTML = `
                    <div class="word-left" onclick="playPronunciation('${word.單字.replace(/'/g, "\\'")}')">
                        ${word.tag ? `<span class="word-tag">${word.tag}</span>` : ''}
                        <span class="word-word">${word.單字}</span>
                        <span class="word-phonetic">${word.音標}</span>
                        <span class="word-pos">${word.詞性}</span>
                        <span class="word-chinese">${word.中文}</span>
                    </div>
                    <div class="word-right">
                        <div class="content-half">
                            <div class="content-text">${word.例句}</div>
                        </div>
                        <div class="content-half">
                            <div class="content-text">${word.翻譯}</div>
                        </div>
                    </div>
                `;

                container.appendChild(row);
            });
        }
    </script>
</body>
</html>
