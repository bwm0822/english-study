<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>英文學習系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .mode-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-selector label {
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            white-space: nowrap;
        }

        .mode-selector select {
            background: white;
            color: #333;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.9em;
            cursor: pointer;
        }

        .mode-selector select:hover {
            background: #f5f5f5;
        }

        .refresh-btn {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.9em;
            cursor: pointer;
            font-weight: 600;
        }

        .refresh-btn:hover {
            background: #45a049;
        }

        .quiz-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-height: 0;
        }

        .quiz-panel {
            text-align: center;
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .quiz-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .quiz-controls label {
            font-size: 1.1em;
            font-weight: 600;
        }

        #quizSheetCheckboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .quiz-sheet-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quiz-sheet-item input {
            cursor: pointer;
        }

        .quiz-sheet-item label {
            cursor: pointer;
            font-size: 1em;
            font-weight: normal;
        }

        .start-quiz-btn {
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 22px;
            font-size: 0.9em;
            line-height: 1;
            cursor: pointer;
            font-weight: 600;
            height: auto;
            min-height: unset;
        }

        .start-quiz-btn:hover {
            background: #0b7dda;
        }

        .quiz-session {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
            min-height: 0;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .quiz-progress {
            font-size: 1.2em;
            color: #666;
        }

        .cancel-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 0.9em;
            cursor: pointer;
            font-weight: 600;
        }

        .cancel-btn:hover {
            background: #da190b;
        }

        .quiz-question {
            text-align: center;
        }

        .quiz-question-text {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
            font-size: 1.3em;
        }

        .quiz-chinese {
            font-size: 1.5em;
            font-weight: 600;
        }

        .quiz-pos {
            font-size: 0.8em;
            color: white;
            background: #2196F3;
            padding: 4px 10px;
            border-radius: 3px;
        }

        .quiz-input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: -25px;
            width: 100%;
            max-width: 500px;
            position: relative;
            flex: 1;
        }

        #quizInput {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }

        #quizInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .feedback-correct {
            background: #4CAF50;
            color: black;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 600;
            text-align: center;
        }

        .feedback-wrong {
            color: red;
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
            font-size: 1.1em;
        }

        .feedback-error {
            background: #f44336;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 600;
            text-align: center;
        }

        .quiz-bottom {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            margin-top: auto;
            padding-top: 0px;
        }

        .quiz-feedback {
            min-height: 60px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .quiz-feedback-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
        }

        .next-btn {
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 0.95em;
            cursor: pointer;
            font-weight: 600;
        }

        .next-btn:hover {
            background: #0b7dda;
        }

        .next-btn:active {
            transform: scale(0.98);
        }

        .quiz-result {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .result-header {
            margin-bottom: 30px;
        }

        .result-header h2 {
            margin-bottom: 20px;
        }

        .result-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            width: 100%;
            flex: 0 0 auto;
            padding: 8px 12px 0 12px;
        }

        .result-score {
            font-size: 1.5em;
            font-weight: 600;
            color: #667eea;
            text-align: center;
            flex: 1;
            line-height: 1;
        }

        .result-words {
            height: calc(100% - 60px);
            overflow-y: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 0 12px 8px 12px;
        }

        .result-word {
            display: flex;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
            height: auto;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            font-size: 0.85em;
        }

        .result-word.correct {
            background: white;
            color: #333;
        }

        .result-word.wrong {
            background: #ffcdd2;
            color: #333;
        }

        .result-word.wrong {
            background: #ffcdd2;
            color: #333;
        }

        .result-word.correct {
            background: white;
            color: #333;
        }

        .result-word-star {
            flex: 0 0 30px;
            text-align: center;
            font-size: 1.2em;
            cursor: pointer;
            color: #ffa500;
        }

        .result-word-star:hover {
            transform: scale(1.2);
        }

        .result-word-tag {
            flex: 0 0 50px;
            background: #667eea;
            color: white;
            padding: 4px 6px;
            border-radius: 3px;
            font-size: 0.7em;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
        }

        .result-word-english {
            flex: 0 0 100px;
            font-weight: bold;
        }

        .result-word-pos {
            flex: 0 0 50px;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            text-align: center;
        }

        .result-word-chinese {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .back-btn {
            background: #666;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 30px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #555;
        }

        .tag-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .tag-filter label {
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            white-space: nowrap;
        }

        .tag-filter-dropdown {
            position: relative;
        }

        .tag-dropdown-btn {
            background: white;
            color: #333;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.9em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 150px;
        }

        .tag-dropdown-btn:hover {
            background: #f5f5f5;
        }

        .tag-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 100;
            min-width: 300px;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            display: none;
            margin-top: 4px;
        }

        .tag-dropdown-menu.active {
            display: block;
        }

        .sheet-item {
            border-bottom: 1px solid #eee;
            position: relative;
        }

        .sheet-item-header {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 8px;
            background: #f9f9f9;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            position: relative;
        }

        .sheet-item-header:hover {
            background: #f0f0f0;
        }

        .sheet-item-header::after {
            content: '▶';
            position: absolute;
            right: 8px;
            font-size: 0.7em;
            color: #999;
            transition: transform 0.2s;
        }

        .sheet-item-header.expanded::after {
            transform: rotate(90deg);
        }

        .sheet-toggle {
            width: 20px;
            text-align: center;
            font-size: 0.8em;
            color: #666;
        }

        .sheet-name {
            flex: 1;
        }

        .sheet-group-header {
            position: sticky;
            top: 0;
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 6px 12px 6px 20px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }

        .sheet-group-header button {
            padding: 4px 12px;
            font-size: 0.85em;
            border: 1px solid #ddd;
            background: white;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 15px;
        }

        .sheet-group-header button:hover {
            background: #f5f5f5;
        }

        .sheet-submenu {
            position: fixed;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 9999;
            min-width: 150px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            display: none;
        }

        .sheet-submenu.expanded {
            display: block;
        }

        .tag-checkbox-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            padding-left: 30px;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .tag-checkbox-item:hover {
            background: #f9f9f9;
        }

        .tag-checkbox-item input[type="checkbox"] {
            cursor: pointer;
            accent-color: #667eea;
            width: 16px;
            height: 16px;
        }

        .stats {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
        }

        .words-container {
            flex: 1;
            overflow-y: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .word-row {
            display: flex;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
            height: auto;
            align-items: center;
        }

        .word-row:nth-child(odd) {
            background: #e3f2fd;
        }

        .word-row:nth-child(even) {
            background: #f5f9ff;
        }

        .word-row:hover {
            background: #bbdefb;
        }

        .word-star {
            flex: 0 0 40px;
            text-align: center;
            font-size: 1.2em;
            cursor: pointer;
            padding: 12px 8px;
            user-select: none;
            color: #ffa500;
        }

        .word-star:hover {
            transform: scale(1.2);
        }

        .word-left {
            flex: 1;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            cursor: pointer;
            overflow: hidden;
        }

        .word-tag {
            background: #667eea;
            color: white;
            padding: 4px 6px;
            border-radius: 3px;
            font-size: 0.7em;
            font-weight: bold;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            line-height: 1.2;
            width: 50px;
            text-align: center;
        }

        .word-tag-sheet {
            font-size: 0.9em;
            min-height: 12px;
        }

        .word-tag-tag {
            font-size: 0.8em;
            min-height: 12px;
        }

        .word-word {
            font-weight: bold;
            color: #333;
            min-width: 100px;
            flex-shrink: 0;
        }

        .word-phonetic {
            color: #667eea;
            font-size: 0.9em;
            min-width: 120px;
            flex-shrink: 0;
        }

        .word-pos {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            color: #666;
            min-width: 50px;
            text-align: center;
            flex-shrink: 0;
        }

        .word-chinese {
            color: #555;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .word-right {
            flex: 1;
            border-left: 1px solid #ddd;
            padding: 12px 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            min-width: 0;
        }

        .content-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            min-width: 0;
            overflow-y: auto;
        }

        .content-text {
            color: #333;
            font-size: 0.9em;
            line-height: 1.4;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #667eea #f5f5f5;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        @media (max-width: 1024px) {
            .word-phonetic {
                display: none;
            }

            .word-right {
                width: 100%;
                border-left: none;
                border-top: 1px solid #ddd;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="mode-selector">
                <label>模式：</label>
                <select id="modeSelect" onchange="changeMode(this.value)">
                    <option value="normal">一般</option>
                    <option value="review">複習</option>
                    <option value="quiz">測驗</option>
                </select>
            </div>
            <div class="tag-filter" id="tagFilterContainer">
                <label>選擇單元：</label>
                <div class="tag-filter-dropdown">
                    <button class="tag-dropdown-btn" onclick="toggleDropdown()">全部 <span>▼</span></button>
                    <div class="tag-dropdown-menu" id="tagDropdownMenu">
                        <div id="sheetGroupsContainer"></div>
                    </div>
                </div>
            </div>
            <div class="tag-filter" id="quizTagFilterContainer" style="display: none;">
                <label>選擇單元：</label>
                <div class="tag-filter-dropdown">
                    <button class="tag-dropdown-btn" onclick="toggleQuizDropdown()">全部 <span>▼</span></button>
                    <div class="tag-dropdown-menu" id="quizTagDropdownMenu">
                        <div id="quizSheetGroupsContainer"></div>
                    </div>
                </div>
            </div>
            <div class="stats" id="stats"></div>
            <button class="refresh-btn" id="refreshBtn" onclick="refreshReview()" style="display: none; margin-left: auto;">刷新</button>
            <button class="start-quiz-btn" id="startQuizBtn" onclick="startQuiz()" style="display: none; margin-left: auto;">開始測驗</button>
        </div>

        <div class="words-container" id="wordsContainer"></div>

        <!-- 測驗界面 -->
        <div class="quiz-container" id="quizContainer" style="display: none;">
            <!-- 測驗開始按鈕 -->
            <div style="display: none; justify-content: center; align-items: center; flex: 1;" id="quizStartPanel">
                <button class="start-quiz-btn" onclick="startQuiz()">開始測驗</button>
            </div>

            <!-- 測驗進行中 -->
            <div class="quiz-session" id="quizSession" style="display: none;">
                <div class="quiz-header">
                    <div class="quiz-progress">
                        <span id="quizProgress">1/10</span>
                    </div>
                    <button class="cancel-btn" onclick="cancelQuiz()">取消</button>
                </div>
                <div class="quiz-question">
                    <div class="quiz-question-text">
                        <span id="quizChinese"></span>
                        <span id="quizPos" class="quiz-pos"></span>
                    </div>
                </div>
                <div class="quiz-input-area">
                    <input type="text" id="quizInput" placeholder="輸入英文單字" onkeypress="handleQuizInput(event)">
                    <div id="quizAnswer" style="display: none; font-size: 1.2em; font-weight: 600; color: red; margin-top: 5px;"></div>
                    <div class="quiz-bottom">
                        <div class="quiz-feedback" id="quizFeedback"></div>
                        <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">下一題</button>
                    </div>
                </div>
            </div>

            <!-- 測驗結果 -->
            <div class="quiz-result" id="quizResult" style="display: none;">
                <div class="result-header-top">
                    <div class="result-score" id="resultScore"></div>
                    <button class="back-btn" onclick="backToQuizPanel()">返回</button>
                </div>
                <div class="result-words" id="resultWords"></div>
            </div>
        </div>
    </div>

    <script>
        let allWords = [];
        let sheetData = {};
        let selectedTags = new Map(); // {sheetName: Set<tag>}
        let currentMode = 'normal'; // 'normal' or 'review' or 'quiz'

        // 測驗相關變數
        let quizWords = [];
        let quizIndex = 0;
        let quizResults = [];

        fetch('output.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                sheetData = data;
                allWords = [];

                // 建立分組下拉選單
                const container = document.getElementById('sheetGroupsContainer');

                Object.entries(sheetData).forEach(([sheetName, words]) => {
                    if (Array.isArray(words)) {
                        // 建立該sheet的所有tag
                        const sheetTags = [...new Set(words.map(w => w.tag))];

                        // 添加到allWords
                        allWords = allWords.concat(words);

                        // 初始化selectedTags中該sheet的所有tag
                        selectedTags.set(sheetName, new Set(sheetTags));

                        // 建立sheet項目
                        const sheetItem = document.createElement('div');
                        sheetItem.className = 'sheet-item';

                        // Sheet標題（可展開）
                        const sheetHeader = document.createElement('div');
                        sheetHeader.className = 'sheet-item-header';
                        sheetHeader.dataset.sheetName = sheetName;

                        const toggleSpan = document.createElement('span');
                        toggleSpan.className = 'sheet-toggle';
                        toggleSpan.textContent = '▶';

                        const sheetCheckbox = document.createElement('input');
                        sheetCheckbox.type = 'checkbox';
                        sheetCheckbox.checked = true;
                        sheetCheckbox.dataset.sheetName = sheetName;
                        sheetCheckbox.onchange = updateFilter;
                        sheetCheckbox.onclick = (e) => {
                            e.stopPropagation();
                        };

                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'sheet-name';
                        nameSpan.textContent = sheetName;

                        sheetHeader.appendChild(sheetCheckbox);
                        sheetHeader.appendChild(nameSpan);

                        // 創建獨立的第二選單
                        const sheetSubmenu = document.createElement('div');
                        sheetSubmenu.className = 'sheet-submenu';
                        sheetSubmenu.dataset.sheetName = sheetName;
                        document.body.appendChild(sheetSubmenu);

                        // 按鈕行
                        const buttonsRow = document.createElement('div');
                        buttonsRow.className = 'sheet-group-header';

                        const selectBtn = document.createElement('button');
                        selectBtn.textContent = '全選';
                        selectBtn.onclick = function(e) {
                            e.stopPropagation();
                            selectAllInSheet(e, sheetName);
                        };

                        const clearBtn = document.createElement('button');
                        clearBtn.textContent = '清除';
                        clearBtn.onclick = function(e) {
                            e.stopPropagation();
                            clearAllInSheet(e, sheetName);
                        };

                        buttonsRow.appendChild(selectBtn);
                        buttonsRow.appendChild(clearBtn);
                        sheetSubmenu.appendChild(buttonsRow);

                        // 該sheet的所有tag
                        sheetTags.forEach(tag => {
                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.value = tag;
                            checkbox.checked = true;
                            checkbox.dataset.sheet = sheetName;
                            checkbox.onchange = updateFilter;
                            checkbox.onclick = (e) => {
                                e.stopPropagation();
                            };

                            const label = document.createElement('div');
                            label.className = 'tag-checkbox-item';
                            label.appendChild(checkbox);
                            const span = document.createElement('span');
                            span.textContent = tag;
                            label.appendChild(span);

                            label.onclick = (e) => {
                                e.stopPropagation();
                                checkbox.checked = !checkbox.checked;
                                updateFilter();
                            };

                            sheetSubmenu.appendChild(label);
                        });

                        // Sheet展開/收起邏輯 - 顯示/隱藏獨立的submenu
                        sheetHeader.onclick = (e) => {
                            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                                e.stopPropagation();

                                // 關閉其他所有的submenu
                                document.querySelectorAll('.sheet-submenu.expanded').forEach(submenu => {
                                    if (submenu !== sheetSubmenu) {
                                        submenu.classList.remove('expanded');
                                    }
                                });

                                // Toggle當前的submenu
                                sheetSubmenu.classList.toggle('expanded');

                                // 如果打開，計算位置並顯示在sheetHeader的右邊
                                if (sheetSubmenu.classList.contains('expanded')) {
                                    const rect = sheetHeader.getBoundingClientRect();
                                    sheetSubmenu.style.top = rect.top + 'px';
                                    sheetSubmenu.style.left = (rect.right + 5) + 'px';
                                }
                            }
                        };

                        sheetItem.appendChild(sheetHeader);
                        container.appendChild(sheetItem);
                    }
                });

                renderWords();

                // 點擊頁面其他地方時關閉所有的submenu
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.sheet-item-header') && !e.target.closest('.sheet-submenu')) {
                        document.querySelectorAll('.sheet-submenu.expanded').forEach(submenu => {
                            submenu.classList.remove('expanded');
                        });
                    }
                });
            })
            .catch(e => {
                document.getElementById('wordsContainer').innerHTML = '❌ 無法讀取 output.json';
            });

        function updateFilter() {
            // 為每個sheet更新selected tags
            selectedTags.forEach((tags, sheetName) => {
                tags.clear();
            });

            // 先檢查sheet checkbox，如果unchecked則skip該sheet
            const enabledSheets = new Set();
            document.querySelectorAll('input[data-sheet-name]').forEach(sheetCheckbox => {
                if (sheetCheckbox.checked) {
                    enabledSheets.add(sheetCheckbox.dataset.sheetName);
                }
            });

            // 只處理enabled sheets的tag checkbox
            document.querySelectorAll('.tag-checkbox-item input').forEach(checkbox => {
                if (checkbox.checked) {
                    const sheetName = checkbox.dataset.sheet;
                    if (enabledSheets.has(sheetName) && selectedTags.has(sheetName)) {
                        selectedTags.get(sheetName).add(checkbox.value);
                    }
                }
            });
            updateDropdownButton();
            renderWords();
        }

        function updateDropdownButton() {
            const btn = document.querySelector('.tag-dropdown-btn');
            let totalSelected = 0;
            selectedTags.forEach(tags => {
                totalSelected += tags.size;

            if (totalSelected === 0) {
                btn.innerHTML = '清除 <span>▼</span>';
            } else {

            const quizFilter = document.querySelector('#quizTagFilterContainer');

        function playPronunciation(word) {
            const SpeechSynthesisUtterance = window.SpeechSynthesisUtterance || window.webkitSpeechSynthesisUtterance;
            const speechSynthesis = window.speechSynthesis || window.webkitSpeechSynthesis;

            if (!SpeechSynthesisUtterance || !speechSynthesis) {
                console.log('Web Speech API not supported');
                return;
            }

            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        function renderWords() {
            const container = document.getElementById('wordsContainer');
            container.innerHTML = '';

            // 檢查enabled sheets
            const enabledSheets = new Set();
            document.querySelectorAll('input[data-sheet-name]').forEach(sheetCheckbox => {
                if (sheetCheckbox.checked) {
                    enabledSheets.add(sheetCheckbox.dataset.sheetName);
                }
            });

            // 根據模式和選中的sheet+tag過濾單字
            let filteredWords;
            if (currentMode === 'review') {
                // 複習模式：只顯示有星號的單字
                filteredWords = allWords.filter(word => {
                    const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                    return localStorage.getItem(`favorite_${wordKey}`) === 'true';
                });
            } else {
                // 一般模式：根據sheet+tag過濾
                filteredWords = allWords.filter(word => {
                    // 如果sheet checkbox unchecked，忽略該sheet
                    if (!enabledSheets.has(word.sheet)) {
                        return false;
                    }
                    const sheetTags = selectedTags.get(word.sheet);
                    return sheetTags && sheetTags.has(word.tag);
                });
            }

            document.getElementById('stats').textContent = `共 ${filteredWords.length} 項`;

            filteredWords.forEach((word, index) => {
                const row = document.createElement('div');
                row.className = 'word-row';

                // 創建星號按鈕
                const starBtn = document.createElement('div');
                starBtn.className = 'word-star';
                const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                const isFavorited = localStorage.getItem(`favorite_${wordKey}`) === 'true';
                starBtn.textContent = isFavorited ? '★' : '☆';
                starBtn.dataset.wordKey = wordKey;
                starBtn.onclick = (e) => {
                    e.stopPropagation();
                    const isFav = localStorage.getItem(`favorite_${wordKey}`) === 'true';
                    if (isFav) {
                        localStorage.removeItem(`favorite_${wordKey}`);
                        starBtn.textContent = '☆';
                    } else {
                        localStorage.setItem(`favorite_${wordKey}`, 'true');
                        starBtn.textContent = '★';
                    }
                };

                // 創建左側內容
                const wordLeft = document.createElement('div');
                wordLeft.className = 'word-left';
                wordLeft.onclick = () => playPronunciation(word.單字);
                wordLeft.innerHTML = `
                    ${word.sheet || word.tag ? `<span class="word-tag"><div class="word-tag-sheet">${word.sheet || ''}</div><div class="word-tag-tag">${word.tag || ''}</div></span>` : ''}
                    <span class="word-word">${word.單字}</span>
                    <span class="word-phonetic">${word.音標}</span>
                    <span class="word-pos">${word.詞性}</span>
                    <span class="word-chinese">${word.中文}</span>
                `;

                // 創建右側內容
                const wordRight = document.createElement('div');
                wordRight.className = 'word-right';
                wordRight.innerHTML = `
                    <div class="content-half">
                        <div class="content-text">${word.例句}</div>
                    </div>
                    <div class="content-half">
                        <div class="content-text">${word.翻譯}</div>
                    </div>
                `;

                row.appendChild(starBtn);
                row.appendChild(wordLeft);
                row.appendChild(wordRight);
                container.appendChild(row);

        function updateQuizDropdownButton() {
            const btn = document.querySelector('#quizTagFilterContainer .tag-dropdown-btn');
            const stats = document.getElementById('stats');
            if (!btn) return;

            // 檢查星號篩選
            const starCheckbox = document.getElementById('quiz-star-filter');
            const filterByStar = starCheckbox ? starCheckbox.checked : false;

            // 檢查 sheet checkbox 的狀態
            const enabledSheets = new Set();
            document.querySelectorAll('input[data-sheet-name]').forEach(sheetCheckbox => {
                if (sheetCheckbox.checked) {
                    enabledSheets.add(sheetCheckbox.getAttribute('data-sheet-name'));
                }
            });

            // 獲取選中的 tags（只考慮 enabled sheets）
            const selectedSheetTags = new Map();
            document.querySelectorAll('input[data-sheet]').forEach(checkbox => {
                if (checkbox.checked && enabledSheets.has(checkbox.dataset.sheet)) {
                    const sheetName = checkbox.dataset.sheet;
                    if (!selectedSheetTags.has(sheetName)) {
                        selectedSheetTags.set(sheetName, new Set());
                    }
                    selectedSheetTags.get(sheetName).add(checkbox.value);
                }
            });

            // 計算選中的單詞數量
            let selectedWords = 0;
            if (selectedSheetTags.size > 0) {
                selectedWords = allWords.filter(word => {
                    if (!selectedSheetTags.has(word.sheet)) {
                        return false;
                    }
                    if (!selectedSheetTags.get(word.sheet).has(word.tag)) {
                        return false;
                    }
                    // 如果勾選星號篩選，只包含有星號的單字
                    if (filterByStar) {
                        const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                        return localStorage.getItem(`favorite_${wordKey}`) === 'true';
                    }
                    return true;
                }).length;
            }

            let totalSelected = 0;
            document.querySelectorAll('input[data-sheet]').forEach(checkbox => {
                if (checkbox.checked && enabledSheets.has(checkbox.dataset.sheet)) {
                    totalSelected++;
                }
            });

            if (totalSelected === 0) {
                btn.innerHTML = '清除 <span>▼</span>';
            } else {
                btn.innerHTML = `已選擇 ${totalSelected} 個 <span>▼</span>`;
            }

            // 更新統計信息 - 顯示選中的單詞數量
            if (stats) {
                stats.textContent = `共 ${selectedWords} 項`;
            }
        }

        function startQuiz() {
            // 檢查星號篩選
            const starCheckbox = document.getElementById('quiz-star-filter');
            const filterByStar = starCheckbox ? starCheckbox.checked : false;

            // 檢查 sheet checkbox 的狀態
            const enabledSheets = new Set();
            document.querySelectorAll('input[data-sheet-name]').forEach(sheetCheckbox => {
                if (sheetCheckbox.checked) {
                    enabledSheets.add(sheetCheckbox.getAttribute('data-sheet-name'));
                }
            });

            // 獲取勾選的tags - 加入到對應的sheet（只考慮 enabled sheets）
            const selectedSheetTags = new Map(); // {sheetName: Set<tag>}
            document.querySelectorAll('input[data-sheet]').forEach(checkbox => {
                if (checkbox.checked && enabledSheets.has(checkbox.dataset.sheet)) {
                    const sheetName = checkbox.dataset.sheet;
                    if (!selectedSheetTags.has(sheetName)) {
                        selectedSheetTags.set(sheetName, new Set());
                    }
                    selectedSheetTags.get(sheetName).add(checkbox.value);
                }
            });

            if (selectedSheetTags.size === 0) {
                alert('請至少選擇一個單元');
                return;
            }

            // 收集要測驗的單詞 - 根據sheet和tag過濾
            quizWords = allWords.filter(word => {
                if (!selectedSheetTags.has(word.sheet)) {
                    return false;
                }
                if (!selectedSheetTags.get(word.sheet).has(word.tag)) {
                    return false;
                }
                // 如果勾選星號篩選，只包含有星號的單字
                if (filterByStar) {
                    const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                    return localStorage.getItem(`favorite_${wordKey}`) === 'true';
                }
                return true;
            });

            if (quizWords.length === 0) {
                alert('選定的單元中沒有單詞');
                return;
            }

            // 隨機排列
            quizWords.sort(() => Math.random() - 0.5);

            // 初始化結果
            quizResults = quizWords.map(word => ({
                word: word,
                isCorrect: null,
                userAnswer: ''
            }));

            quizIndex = 0;
            document.getElementById('quizTagFilterContainer').style.display = 'none';
            document.getElementById('quizStartPanel').style.display = 'none';
            document.getElementById('quizSession').style.display = 'flex';
            showQuizQuestion();
        }

        function showQuizQuestion() {
            const word = quizWords[quizIndex];
            document.getElementById('quizProgress').textContent = `${quizIndex + 1}/${quizWords.length}`;
            document.getElementById('quizChinese').textContent = word.中文;
            document.getElementById('quizPos').textContent = word.詞性;
            document.getElementById('quizInput').value = '';
            document.getElementById('quizFeedback').innerHTML = '';
            document.getElementById('quizAnswer').style.display = 'none';
            document.getElementById('quizInput').disabled = false;
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('quizInput').focus();
        }

        function handleQuizInput(event) {
            if (event.key !== 'Enter') return;
            event.preventDefault();

            const userAnswer = document.getElementById('quizInput').value.trim().toLowerCase();
            const word = quizWords[quizIndex];
            const isCorrect = userAnswer === word.單字.toLowerCase();
            quizResults[quizIndex].isCorrect = isCorrect;
            quizResults[quizIndex].userAnswer = userAnswer;

            const feedbackDiv = document.getElementById('quizFeedback');
            feedbackDiv.innerHTML = '';

            if (isCorrect) {
                const correctDiv = document.createElement('div');
                correctDiv.className = 'feedback-correct';
                correctDiv.textContent = '✓ 正確';
                feedbackDiv.appendChild(correctDiv);
            } else {
                // 显示正确答案
                document.getElementById('quizAnswer').textContent = word.單字;
                document.getElementById('quizAnswer').style.display = 'block';

                // 只显示错误状态
                const errorDiv = document.createElement('div');
                errorDiv.className = 'feedback-error';
                errorDiv.textContent = '✗ 錯誤';
                feedbackDiv.appendChild(errorDiv);
            }

            // 禁用輸入框，顯示下一題按鈕
            document.getElementById('quizInput').disabled = true;
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            quizIndex++;
            if (quizIndex < quizWords.length) {
                showQuizQuestion();
            } else {
                showQuizResult();
            }
        }

        function showQuizResult() {
            document.getElementById('quizSession').style.display = 'none';
            document.getElementById('quizResult').style.display = 'block';

            const correctCount = quizResults.filter(r => r.isCorrect).length;
            const accuracy = Math.round((correctCount / quizResults.length) * 100);

            document.getElementById('resultScore').innerHTML = `正確率: ${accuracy}% (${correctCount}/${quizResults.length})`;

            const resultWordsDiv = document.getElementById('resultWords');
            resultWordsDiv.innerHTML = '';

            quizResults.forEach((result, index) => {
                const wordDiv = document.createElement('div');
                wordDiv.className = `result-word ${result.isCorrect ? 'correct' : 'wrong'}`;

                const word = result.word;
                const wordKey = `${word.sheet}/${word.tag}/${word.單字}`;
                const isFavorited = localStorage.getItem(`favorite_${wordKey}`) === 'true';

                // 星號
                const starSpan = document.createElement('div');
                starSpan.className = 'result-word-star';
                starSpan.textContent = isFavorited ? '★' : '☆';
                starSpan.onclick = (e) => {
                    e.stopPropagation();
                    // 重新檢查當前狀態
                    const currentIsFav = localStorage.getItem(`favorite_${wordKey}`) === 'true';
                    if (currentIsFav) {
                        localStorage.removeItem(`favorite_${wordKey}`);
                        starSpan.textContent = '☆';
                    } else {
                        localStorage.setItem(`favorite_${wordKey}`, 'true');
                        starSpan.textContent = '★';
                    }
                };

                // Sheet/Tag
                const tagDiv = document.createElement('div');
                tagDiv.className = 'result-word-tag';
                tagDiv.innerHTML = `<div>${word.sheet}</div><div>${word.tag}</div>`;

                // 英文單字
                const englishSpan = document.createElement('div');
                englishSpan.className = 'result-word-english';
                englishSpan.textContent = word.單字;

                // 詞性
                const posSpan = document.createElement('div');
                posSpan.className = 'result-word-pos';
                posSpan.textContent = word.詞性;

                // 中文
                const chineseSpan = document.createElement('div');
                chineseSpan.className = 'result-word-chinese';
                chineseSpan.textContent = word.中文;

                wordDiv.appendChild(starSpan);
                wordDiv.appendChild(tagDiv);
                wordDiv.appendChild(englishSpan);
                wordDiv.appendChild(posSpan);
                wordDiv.appendChild(chineseSpan);

                resultWordsDiv.appendChild(wordDiv);
            });
        }

        function backToQuizPanel() {
            document.getElementById('quizTagFilterContainer').style.display = 'flex';
            document.getElementById('quizStartPanel').style.display = 'flex';
            document.getElementById('quizSession').style.display = 'none';
            document.getElementById('quizResult').style.display = 'none';
        }

        function cancelQuiz() {
            if (confirm('確定要取消測驗嗎？')) {
                document.getElementById('quizTagFilterContainer').style.display = 'flex';
                document.getElementById('quizStartPanel').style.display = 'flex';
                document.getElementById('quizSession').style.display = 'none';
                document.getElementById('quizResult').style.display = 'none';
            }
        }
    </script>
</body>
</html>
