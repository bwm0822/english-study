<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>英文學習系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d2d45 0%, #25254f 100%);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            text-align: center;
            flex: 1;
        }

        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 20px 0;
            margin: 0;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
            position: relative;
        }

        .title {
            font-size: 2.5em;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin: 0;
        }

        .settings-btn {
            background: gray;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 1.4em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .settings-btn:hover {
            background: lightgray;
        }

        .settings-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #4a4a62;
            border: 1px solid #5a5a72;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 100;
            min-width: 150px;
            margin-top: 4px;
            display: none;
        }

        .settings-dropdown.active {
            display: block;
        }

        .settings-option {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: none;
            border: none;
            color: #b8b8b8;
            text-align: left;
            cursor: pointer;
            font-size: 1em;
        }

        .settings-option:hover {
            background: #5a5a72;
        }

        .buttons-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 40px 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.5em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            min-width: 200px;
            min-height: 200px;
        }

        .mode-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .mode-btn:active {
            transform: translateY(-2px);
        }

        .mode-btn-icon {
            font-size: 3em;
        }

        .mode-btn-text {
            font-size: 1.8em;
        }

        .english-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .chinese-btn {
            background: linear-gradient(135deg, #2196F3 0%, #21CBF3 100%);
        }

        .chinese-btn:hover {
            background: linear-gradient(135deg, #21CBF3 0%, #2196F3 100%);
            box-shadow: 0 12px 30px rgba(33, 150, 243, 0.6);
        }

    </style>
</head>
<body>
    <div class="title-bar">
        <div class="title">學習網</div>
        <button class="settings-btn" onclick="toggleSettingsMenu()">⚙️</button>
        <div class="settings-dropdown" id="settingsDropdown">
            <button class="settings-option" onclick="showAbout()">ℹ️ 資訊</button>
            <button class="settings-option" onclick="showPronunciationSettings()">🔊 發音</button>
            <button class="settings-option" onclick="updateApp()">🔄 更新</button>
            <button class="settings-option" onclick="clearHistory()">清除紀錄</button>
        </div>
    </div>
    <div class="container">
        <div class="buttons-wrapper">
            <button class="mode-btn english-btn" onclick="goToEnglish()">
                <div class="mode-btn-text">英文</div>
            </button>

            <button class="mode-btn chinese-btn" onclick="goChinese()">
                <div class="mode-btn-text">中文</div>
            </button>
        </div>
    </div>

    <script>
        function goToEnglish() {
            window.location.href = 'english.html';
        }

        function goChinese() {
            window.location.href = 'chinese.html';
        }

        function toggleSettingsMenu() {
            const dropdown = document.getElementById('settingsDropdown');
            dropdown.classList.toggle('active');
        }

        function showAbout() {
            alert('英文學習系統\n版本：2026.07.20.a\n\n功能：\n• 英文學習\n• 中文成語與故事');
        }

        function showPronunciationSettings() {
            alert('發音設定功能');
        }

        function updateApp() {
            if (confirm('即將清除快取並更新應用。確認更新嗎？')) {
                if ('caches' in window) {
                    caches.keys().then(names => {
                        names.forEach(name => caches.delete(name));
                    });
                }
                location.reload(true);
            }
        }

        function clearHistory() {
            if (confirm('確定要清除所有學習紀錄嗎？此操作無法撤銷。')) {
                localStorage.clear();
                alert('紀錄已清除');
            }
        }

        // 點擊外部時關閉菜單
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('settingsDropdown');
            const btn = event.target.closest('.settings-btn');
            if (!btn && dropdown.classList.contains('active')) {
                dropdown.classList.remove('active');
            }
        });
    </script>
</body>
</html>
