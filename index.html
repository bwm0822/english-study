<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>英文學習系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d2d45 0%, #25254f 100%);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            text-align: center;
            flex: 1;
        }

        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 20px 0;
            margin: 0;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
            position: relative;
        }

        .title {
            font-size: 2.5em;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin: 0;
        }

        .settings-btn {
            background: gray;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 1.4em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .settings-btn:hover {
            background: lightgray;
        }

        .settings-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #4a4a62;
            border: 1px solid #5a5a72;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 100;
            min-width: 150px;
            margin-top: 4px;
            display: none;
        }

        .settings-dropdown.active {
            display: block;
        }

        .settings-option {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: none;
            border: none;
            color: #b8b8b8;
            text-align: left;
            cursor: pointer;
            font-size: 1em;
        }

        .settings-option:hover {
            background: #5a5a72;
        }

        .storage-list {
            width: 100%;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .storage-list-item {
            display: flex;
            padding: 12px 16px;
            border-bottom: 1px solid #4a4a62;
            cursor: pointer;
            transition: background 0.2s;
            gap: 20px;
        }

        .storage-list-item:hover {
            background: #3a3a52;
        }

        .storage-list-item.active {
            background: #667eea;
            color: white;
        }

        .storage-list-item.active .storage-item-key,
        .storage-list-item.active .storage-item-preview {
            color: white;
        }

        .storage-item-key {
            color: #999999;
            width: 33.33%;
            word-break: break-all;
            flex-shrink: 0;
        }

        .storage-item-preview {
            flex: 1;
            color: #b8b8b8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9em;
        }

        .json-tree {
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #cccccc;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .json-toggle {
            cursor: pointer;
            user-select: none;
            color: #667eea;
            font-weight: bold;
            margin-right: 4px;
            display: inline-block;
            min-width: 16px;
        }

        .json-toggle:hover {
            color: #8a9eff;
        }

        .json-key {
            color: #bb86fc;
        }

        .json-string {
            color: #cccccc;
        }

        .json-number {
            color: #cccccc;
        }

        .json-boolean {
            color: #f44747;
        }

        .json-null {
            color: #858585;
        }

        .buttons-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 40px 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.5em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            min-width: 200px;
            min-height: 200px;
        }

        .mode-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .mode-btn:active {
            transform: translateY(-2px);
        }

        .mode-btn-icon {
            font-size: 3em;
        }

        .mode-btn-text {
            font-size: 1.8em;
        }

        .english-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .chinese-btn {
            background: linear-gradient(135deg, #2196F3 0%, #21CBF3 100%);
        }

        .chinese-btn:hover {
            background: linear-gradient(135deg, #21CBF3 0%, #2196F3 100%);
            box-shadow: 0 12px 30px rgba(33, 150, 243, 0.6);
        }

        #deleteCurrentBtn:disabled {
            background: #666 !important;
            color: #000 !important;
            cursor: not-allowed;
        }

        #deleteCurrentBtn:not(:disabled) {
            background: #e74c3c !important;
            color: white !important;
            cursor: pointer;
        }

        #deleteCurrentBtn:not(:disabled):hover {
            background: #c0392b !important;
        }

    </style>
</head>
<body>
    <div class="title-bar">
        <div class="title">學習網</div>
        <button class="settings-btn" onclick="toggleSettingsMenu()">⚙️</button>
        <div class="settings-dropdown" id="settingsDropdown">
            <button class="settings-option" onclick="showAbout()">ℹ️ 資訊</button>
            <button class="settings-option" onclick="showPronunciationSettings()">🔊 發音</button>
            <button class="settings-option" onclick="showSpecialPronunciation()">📝 特殊發音</button>
            <div class="settings-option" style="display: flex; align-items: center; justify-content: flex-start; padding: 12px 16px; background: none; border: none; cursor: pointer; gap: 10px;" onclick="document.getElementById('allowRetestCheckbox').click()">
                <input type="checkbox" id="allowRetestCheckbox" style="width: 16px; height: 16px; cursor: pointer;" onclick="event.stopPropagation();">
                <span style="color: #b8b8b8; text-align: left; flex: 1;">允許重測</span>
            </div>
            <div class="settings-option" style="display: flex; align-items: center; justify-content: flex-start; padding: 12px 16px; background: none; border: none; cursor: pointer; gap: 10px;" onclick="document.getElementById('randomQuizCheckbox').click()">
                <input type="checkbox" id="randomQuizCheckbox" style="width: 16px; height: 16px; cursor: pointer;" onclick="event.stopPropagation();">
                <span style="color: #b8b8b8; text-align: left; flex: 1;">隨機測驗</span>
            </div>
            <button class="settings-option" onclick="showStorageRecords()">📋 紀錄</button>
            <button class="settings-option" onclick="updateApp()">🔄 更新</button>
        </div>
    </div>
    <div class="container">
        <div class="buttons-wrapper">
            <button class="mode-btn english-btn" onclick="goToEnglish()">
                <div class="mode-btn-text">英文</div>
            </button>

            <button class="mode-btn chinese-btn" onclick="goChinese()">
                <div class="mode-btn-text">中文</div>
            </button>
        </div>
    </div>

    <!-- 發音設定視窗 -->
    <div id="pronunciationModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #333; border-radius: 8px; padding: 20px; max-width: 500px; width: 90%; color: white;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span style="font-weight: bold; font-size: 1.2em;">🔊 發音設定</span>
                <button onclick="closePronunciationModal()" style="background: none; border: none; color: white; font-size: 1.5em; cursor: pointer;">×</button>
            </div>
            <div style="gap: 20px; display: flex; flex-direction: column;">
                <div style="text-align: left;">
                    <label style="color: white; font-weight: bold; display: block; margin-bottom: 8px;">語言</label>
                    <select id="pronunciationLangSelect" style="width: 100%; padding: 8px; font-size: 1em; border-radius: 4px; border: none;">
                        <!-- 英語 -->
                        <optgroup label="━━━ 英語 ━━━">
                            <option value="en-US">🇺🇸 美國英語 (en-US)</option>
                            <option value="en-GB">🇬🇧 英國英語 (en-GB)</option>
                            <option value="en-AU">🇦🇺 澳洲英語 (en-AU)</option>
                            <option value="en-CA">🇨🇦 加拿大英語 (en-CA)</option>
                            <option value="en-IN">🇮🇳 印度英語 (en-IN)</option>
                            <option value="en-IE">🇮🇪 愛爾蘭英語 (en-IE)</option>
                            <option value="en-NZ">🇳🇿 紐西蘭英語 (en-NZ)</option>
                        </optgroup>
                        <!-- 中文 -->
                        <optgroup label="━━━ 中文 ━━━">
                            <option value="zh-CN">🇨🇳 簡體中文 (zh-CN)</option>
                            <option value="zh-HK">🇭🇰 香港繁體 (zh-HK)</option>
                            <option value="zh-TW">🇹🇼 台灣繁體 (zh-TW)</option>
                        </optgroup>
                        <!-- 亞洲語言 -->
                        <optgroup label="━━━ 亞洲語言 ━━━">
                            <option value="ja-JP">🇯🇵 日語 (ja-JP)</option>
                            <option value="ko-KR">🇰🇷 韓語 (ko-KR)</option>
                            <option value="th-TH">🇹🇭 泰語 (th-TH)</option>
                            <option value="vi-VN">🇻🇳 越南語 (vi-VN)</option>
                            <option value="id-ID">🇮🇩 印尼語 (id-ID)</option>
                            <option value="ta-IN">🇮🇳 泰米爾語 (ta-IN)</option>
                            <option value="hi-IN">🇮🇳 印地語 (hi-IN)</option>
                        </optgroup>
                        <!-- 歐洲語言 -->
                        <optgroup label="━━━ 歐洲語言 ━━━">
                            <option value="fr-FR">🇫🇷 法語 (fr-FR)</option>
                            <option value="fr-CA">🇨🇦 加拿大法語 (fr-CA)</option>
                            <option value="de-DE">🇩🇪 德語 (de-DE)</option>
                            <option value="es-ES">🇪🇸 西班牙語 (es-ES)</option>
                            <option value="es-MX">🇲🇽 墨西哥西班牙語 (es-MX)</option>
                            <option value="it-IT">🇮🇹 義大利語 (it-IT)</option>
                            <option value="pt-PT">🇵🇹 葡萄牙語 (pt-PT)</option>
                            <option value="pt-BR">🇧🇷 巴西葡萄牙語 (pt-BR)</option>
                            <option value="nl-NL">🇳🇱 荷蘭語 (nl-NL)</option>
                            <option value="pl-PL">🇵🇱 波蘭語 (pl-PL)</option>
                            <option value="ru-RU">🇷🇺 俄語 (ru-RU)</option>
                            <option value="sv-SE">🇸🇪 瑞典語 (sv-SE)</option>
                            <option value="da-DK">🇩🇰 丹麥語 (da-DK)</option>
                            <option value="tr-TR">🇹🇷 土耳其語 (tr-TR)</option>
                            <option value="el-GR">🇬🇷 希臘語 (el-GR)</option>
                        </optgroup>
                        <!-- 中東與其他 -->
                        <optgroup label="━━━ 中東與其他 ━━━">
                            <option value="ar-SA">🇸🇦 阿拉伯語 (ar-SA)</option>
                            <option value="he-IL">🇮🇱 希伯來語 (he-IL)</option>
                        </optgroup>
                    </select>
                </div>
                <div style="text-align: left;">
                    <label style="color: white; font-weight: bold; display: block; margin-bottom: 8px;">速度</label>
                    <select id="pronunciationRateSelect" style="width: 100%; padding: 8px; font-size: 1em; border-radius: 4px; border: none;">
                        <option value="0.5">🐢 極慢 (0.5x)</option>
                        <option value="0.8">🐌 慢 (0.8x)</option>
                        <option value="1.0" selected>📢 正常 (1.0x)</option>
                        <option value="1.2">⚡ 快 (1.2x)</option>
                        <option value="1.5">🚀 很快 (1.5x)</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="savePronunciationSettings()" style="flex: 1; padding: 10px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">保存設定</button>
            </div>
        </div>
    </div>

    <!-- 特殊發音視窗 -->
    <div id="specialPronunciationModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #1a1a1a; border-radius: 8px; width: 900px; height: 100vh; color: white; display: flex; flex-direction: column; overflow: hidden;">
            <!-- 頭部 -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #4a4a4a;">
                <span style="font-weight: bold; font-size: 1.2em;">📝 特殊發音</span>
            </div>

            <!-- 主區域 - 上下分割 -->
            <div style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
                <!-- 上半部 - Chinese.json 發音 -->
                <div style="height: 50%; overflow-y: auto; border-bottom: 1px solid #4a4a4a; padding: 20px; background: #0d0d0d;">
                    <div id="jsonPronunciationList" style="display: flex; flex-direction: column; gap: 10px;">
                    </div>
                </div>

                <!-- 下半部 - 自訂發音 -->
                <div style="height: 50%; overflow-y: auto; padding: 20px; background: #0d0d0d; display: flex; flex-direction: column;">
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="text" id="newCustomWord" placeholder="錯誤發音（如：學富五車）" style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #4a4a4a; background: #2a2a2a; color: white; font-size: 1.1em;">
                        <input type="text" id="newCustomPronunciation" placeholder="正確發音（如：學富五居）" style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #4a4a4a; background: #2a2a2a; color: white; font-size: 1.1em;">
                        <button onclick="addCustomPronunciation()" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">新增</button>
                    </div>
                    <div id="customPronunciationList" style="display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto;">
                        <div style="text-align: center; color: #666;">暫無自訂發音</div>
                    </div>
                </div>
            </div>

            <!-- 底部 -->
            <div style="padding: 15px 20px; border-top: 1px solid #4a4a4a; display: flex; gap: 10px;">
                <button onclick="closeSpecialPronunciationModal()" style="flex: 1; padding: 10px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1.1em;">關閉</button>
            </div>
        </div>
    </div>

    <!-- 紀錄（localStorage）視窗 -->
    <div id="storageModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #1a1a1a; border-radius: 8px; width: 900px; height: 100vh; color: white; display: flex; flex-direction: column; overflow: hidden;">
            <!-- 頭部 -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #4a4a4a;">
                <span style="font-weight: bold; font-size: 1.2em;">📋 localStorage 紀錄</span>
                <button id="deleteCurrentBtn" onclick="deleteCurrentStorage()" style="padding: 8px 16px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1.2em;" disabled>🗑️</button>
            </div>

            <!-- 主區域 - 上下分割 -->
            <div style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
                <!-- 上半部 - 列表 -->
                <div style="height: 40%; overflow-y: auto; border-bottom: 1px solid #4a4a4a;">
                    <ul id="storageList" class="storage-list">
                        <!-- 列表項將由JavaScript動態插入 -->
                    </ul>
                </div>

                <!-- 下半部 - 詳細值 -->
                <div style="height: 60%; overflow-y: auto; padding: 20px; background: #0d0d0d;">
                    <div id="storageDetail" style="font-size: 0.9em;">
                        <div style="text-align: center; color: #666; padding: 40px 20px;">選擇一個項目以查看詳細信息</div>
                    </div>
                </div>
            </div>

            <!-- 底部 -->
            <div style="padding: 15px 20px; border-top: 1px solid #4a4a4a; display: flex; gap: 10px;">
                <button onclick="closeStorageModal()" style="flex: 1; padding: 10px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1.1em;">關閉</button>
            </div>
        </div>
    </div>

    <script>
        function goToEnglish() {
            window.location.href = 'english.html';
        }

        function goChinese() {
            window.location.href = 'chinese.html';
        }

        function toggleSettingsMenu() {
            const dropdown = document.getElementById('settingsDropdown');
            dropdown.classList.toggle('active');
        }

        function showAbout() {
            alert('學習網\n版本：2026.07.27.a\n\n功能：\n• 英文學習\n• 中文成語與改錯');
        }

        function showPronunciationSettings() {
            const modal = document.getElementById('pronunciationModal');
            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            const pronunciationLang = settings.pronunciationLang || 'en-US';
            const pronunciationRate = (settings.pronunciationRate || 1.0);

            document.getElementById('pronunciationLangSelect').value = pronunciationLang;
            document.getElementById('pronunciationRateSelect').value = pronunciationRate.toFixed(1);

            modal.style.display = 'flex';
        }

        function showSpecialPronunciation() {
            document.getElementById('settingsDropdown').classList.remove('active');
            const modal = document.getElementById('specialPronunciationModal');
            modal.style.display = 'flex';

            loadJsonPronunciation();
            loadCustomPronunciation();
        }

        function closeSpecialPronunciationModal() {
            document.getElementById('specialPronunciationModal').style.display = 'none';
        }

        function loadJsonPronunciation() {
            fetch('json/chinese.json')
                .then(response => response.json())
                .then(data => {
                    const pronunciationData = data.發音 || {};
                    const container = document.getElementById('jsonPronunciationList');

                    if (Object.keys(pronunciationData).length === 0) {
                        container.innerHTML = '<div style="text-align: center; color: white;">暫無資料</div>';
                        return;
                    }

                    let html = '';
                    for (const [correct, incorrect] of Object.entries(pronunciationData)) {
                        html += `
                            <div style="display: flex; padding: 10px; background: #2a2a2a; border-radius: 4px; border-left: 3px solid #667eea; gap: 10px; align-items: center;">
                                <div class="pronunciation-text" style="width: 50%; text-align: left; color: #b0b0b0; cursor: pointer; padding: 8px; border-radius: 3px; transition: background 0.2s;" data-text="${correct}" onmouseover="this.style.background='#3a3a3a'" onmouseout="this.style.background='transparent'">${correct}</div>
                                <div class="pronunciation-text" style="width: 50%; text-align: left; color: #b0b0b0; cursor: pointer; padding: 8px; border-radius: 3px; transition: background 0.2s;" data-text="${incorrect}" onmouseover="this.style.background='#3a3a3a'" onmouseout="this.style.background='transparent'">${incorrect}</div>
                            </div>
                        `;
                    }
                    container.innerHTML = html;

                    // 添加事件委託
                    document.getElementById('jsonPronunciationList').addEventListener('click', function(e) {
                        if (e.target.classList.contains('pronunciation-text')) {
                            const text = e.target.getAttribute('data-text');
                            if (text) speakText(text);
                        }
                    });
                })
                .catch(error => {
                    console.error('加載發音數據失敗:', error);
                    document.getElementById('jsonPronunciationList').innerHTML = '<div style="color: #e74c3c;">加載失敗</div>';
                });
        }

        function loadCustomPronunciation() {
            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            const customData = settings.pronunciationCustom || {};
            renderCustomPronunciationList(customData);
        }

        function renderCustomPronunciationList(customData) {
            const container = document.getElementById('customPronunciationList');

            if (Object.keys(customData).length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #666;">暫無自訂發音</div>';
                return;
            }

            let html = '';
            for (const [incorrect, correct] of Object.entries(customData)) {
                html += `
                    <div id="item_${incorrect}" style="display: flex; padding: 10px; background: #2a2a2a; border-radius: 4px; border-left: 3px solid #667eea; gap: 10px; align-items: center;">
                        <div class="pronunciation-text" style="width: 50%; text-align: left; color: #b0b0b0; cursor: pointer; padding: 8px; border-radius: 3px; transition: background 0.2s;" data-text="${incorrect}" onmouseover="this.style.background='#3a3a3a'" onmouseout="this.style.background='transparent'">${incorrect}</div>
                        <div class="pronunciation-text" style="flex: 1; text-align: left; color: #b0b0b0; cursor: pointer; padding: 8px; border-radius: 3px; transition: background 0.2s;" id="value_${incorrect}" data-text="${correct}" onmouseover="this.style.background='#3a3a3a'" onmouseout="this.style.background='transparent'">${correct}</div>
                        <button class="edit-btn" data-key="${incorrect}" data-value="${correct}" style="padding: 4px 12px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em;">編輯</button>
                        <button class="delete-btn" data-key="${incorrect}" style="padding: 4px 12px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em;">刪除</button>
                    </div>
                `;
            }
            container.innerHTML = html;

            // 添加事件委託
            container.addEventListener('click', function(e) {
                if (e.target.classList.contains('pronunciation-text')) {
                    const text = e.target.getAttribute('data-text');
                    if (text) speakText(text);
                }
                if (e.target.classList.contains('edit-btn')) {
                    const key = e.target.getAttribute('data-key');
                    const value = e.target.getAttribute('data-value');
                    startEditCustomPronunciation(key, value);
                }
                if (e.target.classList.contains('delete-btn')) {
                    const key = e.target.getAttribute('data-key');
                    deleteCustomPronunciation(key);
                }
            });
        }

        function addCustomPronunciation() {
            const incorrectInput = document.getElementById('newCustomWord');
            const correctInput = document.getElementById('newCustomPronunciation');

            const incorrect = incorrectInput.value.trim();
            const correct = correctInput.value.trim();

            if (!incorrect || !correct) {
                alert('請填入錯誤發音和正確發音');
                return;
            }

            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            if (!settings.pronunciationCustom) {
                settings.pronunciationCustom = {};
            }

            settings.pronunciationCustom[incorrect] = correct;
            localStorage.setItem('setting', JSON.stringify(settings));

            incorrectInput.value = '';
            correctInput.value = '';

            loadCustomPronunciation();
        }

        function startEditCustomPronunciation(incorrect, correct) {
            const keyDiv = document.querySelector(`#item_${incorrect} > div:first-child`);
            const valueDiv = document.getElementById('value_' + incorrect);
            const itemDiv = document.getElementById('item_' + incorrect);

            keyDiv.innerHTML = `
                <input type="text" id="edit_key_${incorrect}" value="${incorrect}" style="width: 100%; padding: 4px; background: #1a1a1a; color: white; border: 1px solid #667eea; border-radius: 4px; font-size: 1.1em;">
            `;

            valueDiv.innerHTML = `
                <input type="text" id="edit_value_${incorrect}" value="${correct}" style="width: 100%; padding: 4px; background: #1a1a1a; color: white; border: 1px solid #667eea; border-radius: 4px; font-size: 1.1em;">
            `;

            const buttons = itemDiv.querySelectorAll('button');
            buttons.forEach(btn => btn.style.display = 'none');

            const keyInput = document.getElementById('edit_key_' + incorrect);
            keyInput.focus();
            keyInput.select();

            const confirmBtn = document.createElement('button');
            confirmBtn.textContent = '確認';
            confirmBtn.onclick = () => saveEditCustomPronunciation(incorrect);
            confirmBtn.style.cssText = 'padding: 4px 12px; background: #52d273; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em;';

            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = '取消';
            cancelBtn.onclick = () => loadCustomPronunciation();
            cancelBtn.style.cssText = 'padding: 4px 12px; background: #999; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em;';

            itemDiv.appendChild(confirmBtn);
            itemDiv.appendChild(cancelBtn);
        }

        function saveEditCustomPronunciation(incorrect) {
            const keyInput = document.getElementById('edit_key_' + incorrect);
            const valueInput = document.getElementById('edit_value_' + incorrect);
            const newKey = keyInput.value.trim();
            const newValue = valueInput.value.trim();

            if (!newKey || !newValue) {
                alert('請輸入正確內容');
                return;
            }

            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            if (!settings.pronunciationCustom) settings.pronunciationCustom = {};

            if (newKey !== incorrect) {
                delete settings.pronunciationCustom[incorrect];
            }

            settings.pronunciationCustom[newKey] = newValue;
            localStorage.setItem('setting', JSON.stringify(settings));
            loadCustomPronunciation();
        }

        function deleteCustomPronunciation(incorrect) {
            if (confirm(`確定要刪除 "${incorrect}" 嗎？`)) {
                const settings = JSON.parse(localStorage.getItem('setting') || '{}');
                if (settings.pronunciationCustom) {
                    delete settings.pronunciationCustom[incorrect];
                    localStorage.setItem('setting', JSON.stringify(settings));
                    loadCustomPronunciation();
                }
            }
        }

        // 與 chinese.html 完全一致的發音函數
        function speakText(text) {
            const SpeechSynthesisUtterance = window.SpeechSynthesisUtterance || window.webkitSpeechSynthesisUtterance;
            const speechSynthesis = window.speechSynthesis || window.webkitSpeechSynthesis;

            if (!SpeechSynthesisUtterance || !speechSynthesis) {
                console.log('Web Speech API not supported');
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            const rate = localStorage.getItem('pronunciationRate') || '1.0';
            utterance.rate = parseFloat(rate);
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        function closePronunciationModal() {
            document.getElementById('pronunciationModal').style.display = 'none';
        }

        function savePronunciationSettings() {
            const langSelect = document.getElementById('pronunciationLangSelect');
            const rateSelect = document.getElementById('pronunciationRateSelect');

            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            settings.pronunciationLang = langSelect.value;
            settings.pronunciationRate = parseFloat(rateSelect.value);

            localStorage.setItem('setting', JSON.stringify(settings));

            // 更新全局變量
            pronunciationLang = settings.pronunciationLang;
            pronunciationRate = settings.pronunciationRate;

            alert('發音設定已保存');
            closePronunciationModal();
        }

        let currentSelectedKey = null;

        function isObject(val) {
            return val !== null && typeof val === 'object';
        }

        function formatJSON(obj, depth = 0, inline = false) {
            const indent = '  '.repeat(depth);

            if (obj === null) {
                return `<span class="json-null">null</span>`;
            }

            if (typeof obj !== 'object') {
                if (typeof obj === 'string') return `<span class="json-string">"${obj}"</span>`;
                if (typeof obj === 'number') return `<span class="json-number">${obj}</span>`;
                if (typeof obj === 'boolean') return `<span style="color: ${obj ? '#52d273' : '#e74c3c'};">${obj}</span>`;
                return String(obj);
            }

            if (Array.isArray(obj)) {
                if (obj.length === 0) return '[]';
                const id = 'arr_' + Math.random().toString(36).substr(2, 9);
                let html = '';
                if (depth === 0) {
                    html = `<span class="json-toggle" onclick="toggleJSON('${id}')">▼</span> `;
                }
                html += `[<br/><span id="${id}" class="json-content">`;
                obj.forEach((item, idx) => {
                    html += `<div style="margin-left: 20px;">${formatJSON(item, depth + 1)}</div>`;
                });
                html += `</span><div>${indent}]</div>`;
                return html;
            }

            const keys = Object.keys(obj);
            if (keys.length === 0) return '{}';

            let html = '';
            if (depth === 0) {
                const id = 'obj_' + Math.random().toString(36).substr(2, 9);
                html = `<span class="json-toggle" onclick="toggleJSON('${id}')">▼</span> `;
                html += `{<br/><span id="${id}" class="json-content">`;

                keys.forEach((key, idx) => {
                    const value = obj[key];
                    const hasContent = isObject(value) && ((Array.isArray(value) && value.length > 0) || (!Array.isArray(value) && Object.keys(value).length > 0));
                    const toggleId = 'key_' + Math.random().toString(36).substr(2, 9);

                    let line = `<div style="margin-left: 20px;">`;
                    if (hasContent) {
                        line += `<span class="json-toggle" onclick="toggleJSON('${toggleId}')">▼</span> `;
                    } else {
                        line += `<span style="display: inline-block; width: 20px;"></span>`;
                    }
                    line += `<span class="json-key">"${key}"</span>: `;

                    if (hasContent) {
                        line += `<span id="${toggleId}" class="json-content">`;
                        line += formatJSON(value, depth + 1);
                        line += `</span>`;
                    } else {
                        line += formatJSON(value, depth + 1);
                    }

                    line += `${idx < keys.length - 1 ? ',' : ''}</div>`;
                    html += line;
                });

                html += `</span><div>${indent}}</div>`;
            } else {
                html = `{<br/>`;
                keys.forEach((key, idx) => {
                    html += `<div style="margin-left: 20px;"><span class="json-key">"${key}"</span>: ${formatJSON(obj[key], depth + 1)}${idx < keys.length - 1 ? ',' : ''}</div>`;
                });
                html += `<div>${indent}}</div>`;
            }
            return html;
        }

        function getValuePreview(value) {
            try {
                const parsed = JSON.parse(value);
                if (typeof parsed === 'object') {
                    if (Array.isArray(parsed)) {
                        return `[Array(${parsed.length})]`;
                    } else {
                        const keys = Object.keys(parsed);
                        return `{${keys.slice(0, 2).join(', ')}${keys.length > 2 ? ', ...' : ''}}`;
                    }
                }
                return String(parsed);
            } catch (e) {
                return value.substring(0, 50) + (value.length > 50 ? '...' : '');
            }
        }

        function showStorageRecords() {
            document.getElementById('settingsDropdown').classList.remove('active');
            const modal = document.getElementById('storageModal');
            const list = document.getElementById('storageList');

            if (localStorage.length === 0) {
                list.innerHTML = '<li style="padding: 20px; text-align: center; color: #666;">暫無紀錄</li>';
            } else {
                list.innerHTML = '';
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const value = localStorage.getItem(key);
                    const preview = getValuePreview(value);

                    const li = document.createElement('li');
                    li.className = 'storage-list-item';
                    li.onclick = () => selectStorageItem(key);
                    li.innerHTML = `<span class="storage-item-key">${key}</span><span class="storage-item-preview">${preview}</span>`;
                    list.appendChild(li);
                }
            }

            currentSelectedKey = null;
            document.getElementById('storageDetail').innerHTML = '<div style="text-align: center; color: #666; padding: 40px 20px;">選擇一個項目以查看詳細信息</div>';
            document.getElementById('deleteCurrentBtn').disabled = true;
            modal.style.display = 'flex';
        }

        function selectStorageItem(key) {
            if (currentSelectedKey === key) {
                currentSelectedKey = null;
                const detail = document.getElementById('storageDetail');
                detail.innerHTML = '<div style="text-align: center; color: #666; padding: 40px 20px;">選擇一個項目以查看詳細信息</div>';
                document.getElementById('deleteCurrentBtn').disabled = true;

                const items = document.querySelectorAll('.storage-list-item');
                items.forEach(item => item.classList.remove('active'));
            } else {
                currentSelectedKey = key;
                const value = localStorage.getItem(key);
                const detail = document.getElementById('storageDetail');

                let formattedValue = value;
                try {
                    const parsed = JSON.parse(value);
                    formattedValue = `<div class="json-tree">${formatJSON(parsed)}</div>`;
                } catch (e) {
                    formattedValue = `<div class="json-tree"><span class="json-string">"${value}"</span></div>`;
                }

                detail.innerHTML = formattedValue;

                const items = document.querySelectorAll('.storage-list-item');
                items.forEach(item => item.classList.remove('active'));
                event.currentTarget.classList.add('active');

                document.getElementById('deleteCurrentBtn').disabled = false;
            }
        }

        function deleteCurrentStorage() {
            if (!currentSelectedKey) return;
            if (confirm(`確定要刪除 "${currentSelectedKey}" 嗎？`)) {
                localStorage.removeItem(currentSelectedKey);
                currentSelectedKey = null;
                showStorageRecords();
                alert('已刪除');
            }
        }

        function toggleJSON(id) {
            const element = document.getElementById(id);
            const toggle = event.target;
            if (element.style.display === 'none') {
                element.style.display = 'inline';
                toggle.textContent = '▼';
            } else {
                element.style.display = 'none';
                toggle.textContent = '▶';
            }
        }

        function closeStorageModal() {
            document.getElementById('storageModal').style.display = 'none';
        }

        function updateApp() {
            if (confirm('即將清除快取並更新應用。確認更新嗎？')) {
                if ('caches' in window) {
                    caches.keys().then(names => {
                        names.forEach(name => caches.delete(name));
                    });
                }
                location.reload(true);
            }
        }

        function clearHistory() {
            if (confirm('確定要清除所有學習紀錄嗎？此操作無法撤銷。')) {
                localStorage.clear();
                initializeLocalStorage();
                alert('紀錄已清除');
            }
        }

        // localStorage 版本控制
        const STORAGE_VERSION = '1.0';

        function initializeLocalStorage() {
            const version = localStorage.getItem('_storageVersion');
            if (!version || version !== STORAGE_VERSION) {
                migrateLocalStorage(version);
                localStorage.setItem('_storageVersion', STORAGE_VERSION);
            }
        }

        function migrateLocalStorage(oldVersion) {
            if (!oldVersion) {
                // 舊版本遷移邏輯
                const oldData = {};

                // 收集舊的localStorage數據
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && !key.startsWith('_')) {
                        oldData[key] = localStorage.getItem(key);
                    }
                }

                // 清除舊數據
                const keysToDelete = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && !key.startsWith('_') && key !== '_storageVersion') {
                        keysToDelete.push(key);
                    }
                }
                keysToDelete.forEach(key => localStorage.removeItem(key));

                // 初始化新結構
                localStorage.setItem('setting', JSON.stringify({}));
                localStorage.setItem('english', JSON.stringify({
                    favorite: {},
                    quiz: {},
                    customWords: []
                }));
                localStorage.setItem('chinese', JSON.stringify({}));

                console.log('已將localStorage升級至版本 ' + STORAGE_VERSION);
            }
        }

        // 頁面加載時初始化localStorage
        initializeLocalStorage();

        // 初始化發音設定全局變量（與chinese.html一致）
        const settings = JSON.parse(localStorage.getItem('setting') || '{}');
        let pronunciationLang = settings.pronunciationLang || 'en-US';
        let pronunciationRate = settings.pronunciationRate || 1.0;

        // 初始化重測設定
        const allowRetestCheckbox = document.getElementById('allowRetestCheckbox');
        if (allowRetestCheckbox) {
            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            allowRetestCheckbox.checked = settings.allowRetest || false;
            allowRetestCheckbox.addEventListener('change', (e) => {
                const settings = JSON.parse(localStorage.getItem('setting') || '{}');
                settings.allowRetest = e.target.checked;
                localStorage.setItem('setting', JSON.stringify(settings));
            });
        }

        // 初始化隨機測驗設定
        const randomQuizCheckbox = document.getElementById('randomQuizCheckbox');
        if (randomQuizCheckbox) {
            const settings = JSON.parse(localStorage.getItem('setting') || '{}');
            randomQuizCheckbox.checked = settings.randomQuiz !== false; // 預設為 true
            randomQuizCheckbox.addEventListener('change', (e) => {
                const settings = JSON.parse(localStorage.getItem('setting') || '{}');
                settings.randomQuiz = e.target.checked;
                localStorage.setItem('setting', JSON.stringify(settings));
            });
        }

        // 點擊外部時關閉菜單
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('settingsDropdown');
            const btn = event.target.closest('.settings-btn');
            if (!btn && dropdown.classList.contains('active')) {
                dropdown.classList.remove('active');
            }
        });

        // 點擊modal外部時關閉
        window.addEventListener('click', function(event) {
            const storageModal = document.getElementById('storageModal');
            const pronunciationModal = document.getElementById('pronunciationModal');
            const specialPronunciationModal = document.getElementById('specialPronunciationModal');
            if (event.target === storageModal) {
                closeStorageModal();
            }
            if (event.target === pronunciationModal) {
                closePronunciationModal();
            }
            if (event.target === specialPronunciationModal) {
                closeSpecialPronunciationModal();
            }
        });
    </script>
</body>
</html>
